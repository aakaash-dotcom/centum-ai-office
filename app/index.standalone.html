<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>CENTUM AI Office</title>
<!-- single-file build: no server, no internet needed -->
<meta name="description" content="Mobile control room for the CENTUM AI Office — agents, tasks, reports.">
<meta name="theme-color" content="#080c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CENTUM Office">



<style>
/* CENTUM AI Office — mobile control room
   Palette: deep desk-blue background, gold = Ravi's brand, status colours from data. */

:root {
  --bg: #080c12;
  --bg-2: #0d141d;
  --card: #131c27;
  --card-2: #182333;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #eaf1f8;
  --muted: #92a1b5;
  --muted-2: #6c7b90;
  --gold: #f5b942;
  --gold-dim: rgba(245, 185, 66, 0.14);
  --green: #2fd07a;
  --amber: #f5b942;
  --red: #ff5c5c;
  --blue: #5b8def;
  --cyan: #31c8c8;
  --radius: 16px;
  --radius-sm: 11px;
  --nav-h: 62px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Tamil", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body {
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
  background:
    radial-gradient(1100px 520px at 50% -12%, rgba(91, 141, 239, 0.13), transparent 62%),
    radial-gradient(800px 420px at 100% 0%, rgba(245, 185, 66, 0.07), transparent 60%),
    var(--bg);
  min-height: 100vh;
}

a { color: var(--gold); text-decoration: none; }
a:active { opacity: 0.7; }

/* ---------------------------------------------------------------- header */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(8, 12, 18, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
}
.topbar-row { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
  background: linear-gradient(145deg, #f7c65f, #d99520);
  color: #1a1206; font-weight: 800; font-size: 15px;
  display: grid; place-items: center;
  box-shadow: 0 3px 12px rgba(245, 185, 66, 0.28);
}
.brand-text { min-width: 0; }
.brand-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub { font-size: 11px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1 1 auto; }

.health-chip {
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  padding: 5px 9px; border-radius: 999px; white-space: nowrap;
  border: 1px solid currentColor;
}
.health-GOOD { color: var(--green); background: rgba(47, 208, 122, 0.1); }
.health-ATTENTION { color: var(--amber); background: rgba(245, 185, 66, 0.1); }
.health-CRITICAL { color: var(--red); background: rgba(255, 92, 92, 0.12); }

.freeze-strip {
  margin-top: 10px; display: flex; align-items: center; gap: 8px;
  background: rgba(255, 92, 92, 0.09);
  border: 1px solid rgba(255, 92, 92, 0.3);
  color: #ffb3b3; border-radius: 10px;
  padding: 8px 10px; font-size: 12px; line-height: 1.35;
}
.freeze-strip strong { color: #ff8a8a; }

/* ---------------------------------------------------------------- layout */
.wrap { padding: 16px 16px 8px; max-width: 720px; margin: 0 auto; }
.screen { animation: fade 0.18s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.section-title {
  font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted-2); font-weight: 700; margin: 22px 2px 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-title .count {
  background: var(--card-2); color: var(--muted); border-radius: 999px;
  padding: 1px 8px; font-size: 11px; letter-spacing: 0;
}

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.card.tap { cursor: pointer; transition: transform 0.12s, border-color 0.12s; }
.card.tap:active { transform: scale(0.988); border-color: var(--line-strong); }

.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.tiny { font-size: 11.5px; color: var(--muted-2); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

/* ---------------- hero ---------------- */
.hero {
  background: linear-gradient(155deg, rgba(91, 141, 239, 0.16), rgba(245, 185, 66, 0.06) 62%, transparent);
  border: 1px solid var(--line-strong);
  border-radius: 20px; padding: 18px 16px;
}
.hero h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
.hero .sub { color: var(--muted); font-size: 13px; }
.hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.stat {
  background: rgba(255, 255, 255, 0.035); border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 8px; text-align: center;
}
.stat b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.stat span { font-size: 10.5px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.05em; }

/* ---------------- status dots + chips ---------------- */
.dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04); }
.dot.pulse { animation: pulse 2.4s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.42; } }

.chip {
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
  background: var(--card-2); color: var(--muted); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.gold { background: var(--gold-dim); color: var(--gold); border-color: rgba(245, 185, 66, 0.3); }
.chip.free { background: rgba(47, 208, 122, 0.12); color: var(--green); border-color: rgba(47, 208, 122, 0.3); }
.chip.topper { background: rgba(91, 141, 239, 0.13); color: #9dbcff; border-color: rgba(91, 141, 239, 0.32); }
.chip.centum { background: rgba(245, 185, 66, 0.13); color: var(--gold); border-color: rgba(245, 185, 66, 0.32); }
.chip.warn { background: rgba(255, 92, 92, 0.12); color: #ff9d9d; border-color: rgba(255, 92, 92, 0.3); }

.agent-avatar {
  width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
  background: var(--card-2); border: 1px solid var(--line-strong); color: var(--text);
}

/* ---------------- progress ---------------- */
.bar { height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: 99px; transition: width 0.4s; }

/* ---------------- action cards ---------------- */
.action {
  border-left: 3px solid var(--gold);
  background: linear-gradient(100deg, rgba(245, 185, 66, 0.09), transparent 55%), var(--card);
  border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px;
}
.action-head { display: flex; gap: 10px; align-items: flex-start; }
.action-num {
  width: 22px; height: 22px; border-radius: 7px; flex: 0 0 auto; margin-top: 1px;
  background: var(--gold); color: #1a1206; font-size: 12px; font-weight: 800;
  display: grid; place-items: center;
}
.action h3 { margin: 0; font-size: 15px; line-height: 1.35; letter-spacing: -0.01em; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 11px; padding: 11px 14px; font-size: 14px; font-weight: 650;
  border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
  cursor: pointer; width: 100%; font-family: inherit;
}
.btn:active { transform: scale(0.985); }
.btn.primary { background: linear-gradient(140deg, #f7c65f, #dd9a22); color: #1a1206; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 8px 11px; font-size: 13px; width: auto; }
.btn-row { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.btn-row .btn { width: auto; flex: 1 1 auto; }

/* ---------------- tabs / segments ---------------- */
.segmented {
  display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 4px; margin-bottom: 12px; overflow-x: auto;
  scrollbar-width: none;
}
.segmented::-webkit-scrollbar { display: none; }
.segmented button {
  flex: 1 0 auto; border: 0; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 9px;
  font-family: inherit; cursor: pointer; white-space: nowrap;
}
.segmented button.on { background: var(--card-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.segmented button .n { color: var(--muted-2); font-size: 11px; margin-left: 5px; }

/* ---------------- filters ---------------- */
.filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button {
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600;
  font-family: inherit; white-space: nowrap; cursor: pointer;
}
.filters button.on { background: var(--gold-dim); color: var(--gold); border-color: rgba(245, 185, 66, 0.35); }
.search {
  width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; padding: 11px 13px; font-size: 15px; font-family: inherit; margin-bottom: 12px;
}
.search::placeholder { color: var(--muted-2); }

/* ---------------- log timeline ---------------- */
.log-list { position: relative; margin: 4px 0 0; padding-left: 18px; }
.log-list::before {
  content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px;
  width: 1px; background: var(--line-strong);
}
.log-item { position: relative; padding: 8px 0 8px 2px; }
.log-item::before {
  content: ""; position: absolute; left: -18px; top: 14px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--card-2);
  border: 2px solid var(--muted-2);
}
.log-item.verb-UPLOAD::before, .log-item.verb-APPROVED::before { border-color: var(--green); }
.log-item.verb-GATE::before, .log-item.verb-CHECK::before { border-color: var(--blue); }
.log-item.verb-BLOCKED::before { border-color: var(--red); }
.log-item.verb-STOP::before { border-color: var(--gold); }
.log-verb { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold); }
.log-meta { font-size: 11px; color: var(--muted-2); }
.log-body { font-size: 13.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }

/* ---------------- markdown rendering ---------------- */
.md { font-size: 14.5px; line-height: 1.62; color: #d7e2ee; word-wrap: break-word; }
.md h1 { font-size: 19px; margin: 18px 0 8px; letter-spacing: -0.02em; }
.md h2 { font-size: 16px; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 14.5px; margin: 16px 0 6px; color: #fff; }
.md h4 { font-size: 13.5px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 20px; }
.md li { margin: 4px 0; }
.md ul.nested { margin: 4px 0 4px 6px; }
.md li.task { list-style: none; margin-left: -16px; }
.md li.task.done { color: var(--muted-2); text-decoration: line-through; }
.md code {
  background: rgba(255, 255, 255, 0.07); padding: 1.5px 5px; border-radius: 5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  color: #ffd98a; word-break: break-word;
}
.md pre {
  background: #060a0f; border: 1px solid var(--line); border-radius: 11px;
  padding: 12px; overflow-x: auto; margin: 10px 0;
}
.md pre code { background: none; color: #b9e6c9; padding: 0; font-size: 12px; line-height: 1.5; white-space: pre; }
.md blockquote {
  margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--gold);
  background: rgba(245, 185, 66, 0.06); border-radius: 0 9px 9px 0; color: #e8d9b6;
}
.md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.md strong { color: #fff; }
.md .tw { overflow-x: auto; margin: 12px 0; -webkit-overflow-scrolling: touch; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 460px; }
.md th, .md td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--card-2); color: #fff; font-size: 12px; letter-spacing: 0.02em; white-space: nowrap; }
.md tr:nth-child(even) td { background: rgba(255, 255, 255, 0.018); }

/* ---------------- nav ---------------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(11, 16, 23, 0.9);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav button {
  border: 0; background: none; color: var(--muted-2); font-family: inherit;
  font-size: 10.5px; font-weight: 600; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 0;
}
.nav button.on { color: var(--gold); }
.nav svg { width: 21px; height: 21px; stroke-width: 1.9; }
.nav .badge {
  position: absolute; transform: translate(15px, -12px);
  background: var(--red); color: #fff; font-size: 9.5px; font-weight: 700;
  border-radius: 999px; padding: 1px 5px; min-width: 15px; text-align: center;
}

/* ---------------- misc ---------------- */
.empty { text-align: center; color: var(--muted-2); font-size: 13.5px; padding: 26px 12px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  background: #eaf1f8; color: #0b1017; font-weight: 650; font-size: 13.5px;
  padding: 10px 16px; border-radius: 999px; z-index: 90;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); animation: pop 0.2s ease-out;
  max-width: 88vw; text-align: center;
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

.kv { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.kv:last-child { border-bottom: 0; }
.kv b { color: var(--muted-2); font-weight: 600; flex: 0 0 40%; }
.kv span { color: var(--text); }

.banner {
  border-radius: var(--radius); padding: 13px 14px; margin-bottom: 12px;
  border: 1px solid var(--line-strong); background: var(--card);
  font-size: 13.5px; line-height: 1.5;
}
.banner .t { font-weight: 700; margin-bottom: 4px; font-size: 14px; }
.banner.warn { background: rgba(255, 92, 92, 0.08); border-color: rgba(255, 92, 92, 0.28); }
.banner.info { background: rgba(91, 141, 239, 0.08); border-color: rgba(91, 141, 239, 0.26); }
.banner.gold { background: var(--gold-dim); border-color: rgba(245, 185, 66, 0.28); }

.steps { counter-reset: s; padding: 0; margin: 0; list-style: none; }
.steps li {
  position: relative; padding: 0 0 14px 34px; font-size: 14px; color: #d7e2ee;
}
.steps li::before {
  counter-increment: s; content: counter(s);
  position: absolute; left: 0; top: -1px;
  width: 22px; height: 22px; border-radius: 8px; background: var(--card-2);
  border: 1px solid var(--line-strong); color: var(--gold);
  font-size: 12px; font-weight: 700; display: grid; place-items: center;
}
.steps li:not(:last-child)::after {
  content: ""; position: absolute; left: 10.5px; top: 24px; bottom: 2px;
  width: 1px; background: var(--line-strong);
}

.tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px; cursor: pointer;
}
.tile:active { transform: scale(0.985); }
.tile .ic { font-size: 19px; }
.tile .lb { font-size: 13.5px; font-weight: 650; margin-top: 7px; }
.tile .sb { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; }

/* ================================================================
   pixel office (top view) — the game layer
   ================================================================ */
.pixel-card { padding: 0; overflow: hidden; background: #0a0f16; border-color: rgba(255,255,255,0.1); }
.pixel-wrap { position: relative; line-height: 0; background: #0a0f16; }
.pixel-canvas {
  display: block; width: 100%; height: auto;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  touch-action: manipulation;
}
.pixel-wrap.is-closed .pixel-canvas { filter: saturate(0.55); }

.pixel-power {
  position: absolute; left: 8px; top: 8px;
  font-size: 10.5px; font-weight: 650; letter-spacing: 0.02em;
  padding: 4px 8px; border-radius: 7px;
  background: rgba(8,12,18,0.78); border: 1px solid var(--line-strong);
  color: var(--muted); line-height: 1.3; max-width: 66%;
}
.pixel-power b { color: #fff; letter-spacing: 0.04em; }
.pixel-power-LIVE { border-color: rgba(47,208,122,0.5); }
.pixel-power-LIVE b { color: var(--green); }
.pixel-power-QUIET { border-color: rgba(245,185,66,0.5); }
.pixel-power-QUIET b { color: var(--amber); }
.pixel-power-CLOSED { border-color: rgba(255,92,92,0.45); }
.pixel-power-CLOSED b { color: var(--red); }

.legend { display: flex; flex-wrap: wrap; gap: 5px 10px; margin: 10px 2px 4px; }
.legend-item { font-size: 11px; color: var(--muted-2); display: inline-flex; align-items: center; gap: 4px; }
.legend-item i { font-style: normal; font-size: 10px; }

.lb-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 2px; border-bottom: 1px dashed var(--line);
}
.lb-row:last-child { border-bottom: 0; }
.lb-emoji { font-size: 13px; }
.meter { width: 46px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; flex: 0 0 auto; }
.meter i { display: block; height: 100%; border-radius: 99px; }

/* ================================================================
   bottom sheet
   ================================================================ */
.scrim {
  position: fixed; inset: 0; background: rgba(4,7,11,0.6);
  backdrop-filter: blur(2px); z-index: 80; animation: fade 0.15s ease-out;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 85;
  background: var(--bg-2); border-top: 1px solid var(--line-strong);
  border-radius: 20px 20px 0 0;
  padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height: 86vh; overflow-y: auto;
  transform: translateY(102%); transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 -18px 40px rgba(0,0,0,0.55);
  animation: none;
}
.sheet.on { transform: translateY(0); }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.sheet-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.sheet-x {
  border: 1px solid var(--line-strong); background: var(--card); color: var(--muted);
  width: 28px; height: 28px; border-radius: 9px; font-size: 13px; cursor: pointer;
  flex: 0 0 auto; font-family: inherit;
}
.sheet-body { margin: 6px 0 4px; }
.sheet-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.sheet .md { font-size: 13.5px; }

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-text">
        <div class="brand-title">CENTUM AI Office</div>
        <div class="brand-sub" id="brandSub">Connecting…</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button id="refreshBtn" class="chip" title="Refresh office data" style="cursor:pointer;font-size:13px;padding:5px 10px">⟳</button>
    <div id="healthChip" class="health-chip health-ATTENTION">…</div>
  </div>
  <div id="freezeStrip" class="freeze-strip" hidden></div>
</header>

<main id="view" class="wrap"><div class="empty">Loading the office…</div></main>

es in §5, the stations in §15).\n2. agents/agent-04/current.md — your station, your lane, your stop condition.\n3. agents/agent-04/roster.md — your generation. If you are a successor, read agents/agent-04/handover.md first: your predecessor left notes and you continue from there.\n4. departments/registry.json and PLAN.md — what the office is planning right now.\n\nDO THIS NOW (no Drive writes while the freeze is on):\n1. Write a START line in agents/agent-04/log.md in the format in OFFICE.md §7.\n2. Report to the manager chat, in three lines: which lane this station owns, what content this lane will produce, and what you need before you can start (a task file with a stop condition, or the GO).\n3. State the first concrete deliverable you could produce in one session once a task is assigned.\n4. Then stop and wait. Do not invent work, do not harvest, do not upload anything.\n\nNEVER: touch Drive while the freeze is on (except reading), delete or rename anything on Drive, paste the Apps Script secret anywhere, edit catalogue.json, or work on classes 11/12 while they are parked.\n\nPaste this into a fresh Arena chat for slot agent-04.","has_task":false,"current_html":"<h1>agent-04 — FACTORY Lane</h1>\n<p>STATUS: STAGED (awaiting owner GO — freeze in force) ROLE: FACTORY — watermark strip, CENTUM brand, A5, 2-up A4 / booklet, print files TASK: TASK-011 — Rebuild the 2-up pipeline without papers/manifest.json (queued) PROGRESS: 0% FILES PRODUCED: 0 BLOCKER: none NEXT STEP: on GO — rebuild <code>qp_2up.py</code> so it depends on nothing that lived in <code>papers/</code>, then produce one approved sample STOP CONDITION: one approved sample of each: A5 branded, 2-up A4 cut-ready, our WM applied — all in <code>_print/</code>, all three links in log.md</p>\n<hr>\n<h2>Your lane in one line</h2>\n<p>You turn a gated original into a printable, branded student file. You are the only lane allowed to strip third-party marks and apply ours. You never judge subject matter — if the gate has not passed, you do not touch the file.</p>\n<h2>The three known jobs</h2>\n<ol>\n<li><strong>Rebuild <code>qp_2up.py</code></strong> (TASK-011) — it currently needs <code>brand_booklet.process_file</code> + <code>papers/manifest.json</code>, both from a wiped workspace. Make it take an input file (or Drive folder path) and write the 2-up directly.</li>\n<li><strong>Finish the Class 8 watermark run</strong> — paused at <strong>98/444</strong>. Files 1–98 were done with the pre-2026-09-16 angle and <strong>need recheck</strong>; resume at index 99 with the corrected direction (<code>ledgers/wm_done.json</code>). Do not resume without owner GO.</li>\n<li><strong>One approved sample per format</strong> before any batch — A5, 2-up, booklet, WM. Get the sample approved, then batch.</li>\n</ol>\n<h2>Non-negotiables</h2>\n<ul>\n<li>Watermark: BL→TR, opacity ≈ 0.17, sky (0.36, 0.68, 0.92), one per A5 slot, <strong>vector overlay</strong> — never re-encode the scan, never mark a Drive original.</li>\n<li>Strip third-party marks with <code>PDF_REDACT_IMAGE_NONE | PDF_REDACT_LINE_ART_NONE</code>. Raster inpaint only with the safety gate, and if unsure, leave it and log it.</li>\n<li>Print output: 2-up imposes two A5s at true size, cut-ready. Verify page order by opening the PDF.</li>\n<li>Batch safely: write the resume index to <code>ledgers/wm_done.json</code> every 25 files. Assume your session can die at any moment.</li>\n<li>Never delete. Never restructure. Never touch the old vault's layout.</li>\n<li>Checklist: <code>training/quality-checklist.md</code> §7.</li>\n</ul>","log":[{"timestamp":"2026-09-23T13:35Z","verb":"STAGED","body":"slot created by Manager; role FACTORY · freeze in force, awaiting owner GO · next: TASK-011 on GO","age_minutes":35,"age_label":"35 min ago","raw":"2026-09-23T13:35Z | STAGED | slot created by Manager; role FACTORY | freeze in force, awaiting owner GO | next: TASK-011 on GO"}],"visual":{"state":"sleeping_off","tone":"grey","label":"Off ich lane this station owns, what content this lane will produce, and what you need before you can start (a task file with a stop condition, or the GO).\n3. State the first concrete deliverable you could produce in one session once a task is assigned.\n4. Then stop and wait. Do not invent work, do not harvest, do not upload anything.\n\nNEVER: touch Drive while the freeze is on (except reading), delete or rename anything on Drive, paste the Apps Script secret anywhere, edit catalogue.json, or work on classes 11/12 while they are parked.\n\nPaste this into a fresh Arena chat for slot agent-05.","has_task":false,"current_html":"<h1>agent-05 — QA / CENTUM BUILD Lane</h1>\n<p>STATUS: STAGED (awaiting owner GO — freeze in force) ROLE: QA + CENTUM BUILD — page-1 gate tool, verification, quarantine audits, test player support TASK: TASK-001 — Build the page-1 subject gate (<code>tools/page1_gate.py</code>) (queued) PROGRESS: 0% FILES PRODUCED: 0 BLOCKER: none NEXT STEP: on GO — build the gate tool and run it over the whole old vault (read-only) producing <code>ledgers/gate_results.csv</code> STOP CONDITION: <code>tools/page1_gate.py</code> runs over a folder and writes PASS/REVIEW/FAIL rows; a report lists the true subject of every file it examined</p>\n<hr>\n<h2>Your lane in one line</h2>\n<p>You are the reason the next four days are not wasted. <strong>The office's single biggest gap is the page-1 subject gate</strong> — the missing tool that let Tamil papers be filed as Science for two days. Build it, then be the independent verifier of every other lane's output.</p>\n<h2>TASK-001 specifics</h2>\n<ul>\n<li>Input: a PDF, a folder, or a local path. Output: subject verdict per page 1.</li>\n<li>Read the text layer first; OCR when there is no text layer; recognise Tamil tokens — அறிவியல் Science · கணிதம் Maths · தமிழ் Tamil · ஆங்கிலம் English · சமூக அறிவியல் Social Science · வினாத்தாள் question paper.</li>\n<li>Handle the known trap: an all-subject bundle's page 1 may show a subject table, and a Tamil <em>paper</em> may sit behind an English <em>title</em>. Look at the subject heading inside the paper, plus the section markers (Part I/II/III, marks scheme).</li>\n<li>Verdicts: <strong>PASS</strong> (matches the name), <strong>REVIEW</strong> (ambiguous — human decides, never auto-publish), <strong>FAIL</strong> (wrong subject → quarantine).</li>\n<li>Append to <code>ledgers/gate_results.csv</code> as it goes. Never rewrite old rows.</li>\n<li>It must be rerunnable and idempotent — the same file gated twice yields the same row, not a duplicate.</li>\n</ul>\n<h2>Your other jobs</h2>\n<ul>\n<li>Verify every lane's uploads by <code>list</code>ing Drive, not by reading their summaries.</li>\n<li>First audit after the gate: the ~185 \"unique Science originals\" and the 10th Quarterly 2026 STATE files (four files named Science — known contaminated).</li>\n<li>Quarantine report: what failed, why, and the Drive link, so the owner can decide.</li>\n<li>Later: stand up the Centum test side — the JSON from agent-03 loading into the player and scoring correctly, and the first recording opening. <strong>No Centum checkout until both work.</strong></li>\n</ul>\n<h2>Rules</h2>\n<p>Judge files, never authors. Evidence for every verdict. Nothing auto-publishes on REVIEW. Never delete — quarantine.</p>","log":[{"timestamp":"2026-09-23T13:35Z","verb":"STAGED","body":"slot created by Manager; role QA/CENTUM · freeze in force, awaiting owner GO · next: TASK-001 on GO","age_minutes":35,"age_label":"35 min ago","raw":"2026-09-23T13:35Z | STAGED | slot created by Manager; role QA/CENTUM | freeze in force, awaiting owner GO | next: TASK-001 on GO"}],"visual":{"state":"sleeping_off","tone":"grey","label":"Off duty — never started","efficiency":0}}]}],"registry":[{"id":"harvest","name":"Harvest","room":"main","status":"OPEN","opened":"2026-09-23","purpose":"Everything the student reads or prints: public papers, models, banks, notes, print files, QA.","stations":[
