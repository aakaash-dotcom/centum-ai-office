t only greps strings and understands no Tamil and no subjects). This tool is the gate every other task's files must…","html":"<h1>TASK-001 — Build the page-1 subject gate (<code>tools/page1_gate.py</code>)</h1>\n<p>Lane: QA/CENTUM (agent-05) Priority: 0 — everything else waits on this Shelf: n/a (tooling) Blocked by: none — <strong>this can be built during the freeze</strong> (no Drive writes required for the tool itself) Owner approval needed: no Estimate: 1–2 agent sessions</p>\n<h2>Why this task</h2>\n<p>Four days were lost to one failure: a Science listing produced Tamil papers, and nothing in the pipeline could tell. <code>qc_scan.py</code> cannot do it (it only greps strings and understands no Tamil and no subjects). This tool is the gate every other task's files must pass. Build it first.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Existing PDFs to test against</td><td><code>COLLECT/GOVT_PYQ/*.pdf</code> (bundle + already-split files), any local PDFs</td><td>available in workspace</td></tr><tr><td>Tamil subject tokens</td><td>listed below</td><td>known</td></tr><tr><td>Old scripts for reference</td><td><code>qc_scan.py</code>, <code>ocr.py</code>, <code>subject_infer.py</code></td><td>in the workspace root / <code>tools/</code></td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Write <code>tools/page1_gate.py</code> with this interface: <code>python3 tools/page1_gate.py --pdf &lt;file&gt; [--pages 1] [--out ledgers/gate_results.csv]</code> <code>python3 tools/page1_gate.py --folder &lt;path&gt; [--recursive] [--out ...]</code></li>\n<li>Logic: try the page-1 text layer (PyMuPDF <code>page.get_text()</code>), else render page 1 at ~200 dpi and OCR it. Search for subject tokens and section markers.</li>\n<li>Tamil/English tokens to detect: அறிவியல் = Science · கணிதம் = Maths · தமிழ் = Tamil · ஆங்கிலம் = English · சமூக அறிவியல் / சமூகம் = Social Science · வினாத்தாள் = question paper · மொழி = language English tokens: Science / Mathematics / Maths / Social Science / English / Tamil + \"Part I/II/III\".</li>\n<li><strong>Handle the two known traps explicitly:</strong> (a) an all-subject bundle page that lists subjects — that is a <em>contents</em> page, not a subject; detect it and return REVIEW; (b) a paper whose <em>heading</em> is English but whose <em>body</em> is Tamil medium — the subject is what the questions are about, the medium goes in its own column.</li>\n<li>Verdict rules: exactly one subject matched → <code>PASS</code>; matched subject different from the filename token → <code>FAIL</code>; zero or ≥2 candidates, or contents-page detected → <code>REVIEW</code>.</li>\n<li>Append rows to <code>ledgers/gate_results.csv</code> (schema in <code>ledgers/README.md</code>). Idempotent: re-running on the same file does not create a second row for the same md5.</li>\n<li>Test it on real files: the split SSLC Science STATE PDFs (expect PASS), the known bad ones (expect FAIL: the four \"Science\" 10th Quarterly 2026 STATE files that open as Tamil).</li>\n<li>Write a short results summary — <code>tools/PAGE1_GATE_RESULTS.md</code>: how many PASS / REVIEW / FAIL, with the filenames in each bucket.</li>\n</ol>\n<h2>Deliverables (exact names)</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Where</th></tr></thead><tbody><tr><td><code>tools/page1_gate.py</code></td><td>committed to this repo (not just the session)</td></tr><tr><td><code>ledgers/gate_results.csv</code></td><td>updated rows (append only, never rewrite existing rows)</td></tr><tr><td><code>tools/PAGE1_GATE_RESULTS.md</code></td><td>summary table</td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>The tool runs over a folder in one command and produces a verdict per file; run against the split Science files it says PASS, and against the known Tamil-as-Science files it says FAIL. <strong>Stop there</strong> — do not start gating the whole vault (that is TASK-018).</p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0 (universal). For this task the \"file opens/renders\" item means the tool runs clean on a fresh shell.</p>\n<h2>Techniques</h2>\n<p>PyMuPDF for text/redaction (<code>OFFICE.md</code> §5.5 for the redaction flags if you reuse them), OCR fallback per §5.0. Ledgers in-repo per §5.8. No Drive writes needed.</p>","path":"tasks/archive/2026-09-23-round1/TASK-001-page1-subject-gate.md"},{"slug":"TASK-002-publish-sslc-science","id":"TASK-002","title":"Publish gated SSLC Science 2022–2026 into StudyHub","lane":"PYQ (agent-01)","priority":"1 (Class 10 Science)","shelf":"free","blocked_by":"TASK-001 (the gate tool must exist)","owner_approval":"yes — this is the first student-facing publish since the freeze; needs GO","estimate":"1 agent session","stop_condition":"Five files in five year folders. Ravi opens any one of them on his phone and page 1 says Science (அறிவியல்), not Tamil. Links are in the log. **Then stop** — do not continue into district files, do not start Maths.","why":"These are the only high-trust files the team produced (split from official DGE bundles, md5 already logged). Five files, five years of Class 10 Science public papers, is the first thing a parent can actually open and recognise. This is the visible proof the o…","html":"<h1>TASK-002 — Publish gated SSLC Science 2022–2026 into StudyHub</h1>\n<p>Lane: PYQ (agent-01) Priority: 1 (Class 10 Science) Shelf: free Blocked by: TASK-001 (the gate tool must exist) Owner approval needed: yes — this is the first student-facing publish since the freeze; needs GO Estimate: 1 agent session</p>\n<h2>Why this task</h2>\n<p>These are the only high-trust files the team produced (split from official DGE bundles, md5 already logged). Five files, five years of Class 10 Science public papers, is the first thing a parent can actually open and recognise. This is the visible proof the office works.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>5 SSLC Science STATE PDFs</td><td>Drive <code>Question Papers/10th/Annual/{2022,2023,2024,2025,2026}/STATE/10_Science_Annual_&lt;year&gt;_STATE.pdf</code></td><td>present, md5 in <code>COLLECT_LOG.csv</code>, page-1 confirmation outstanding</td></tr><tr><td>Gate tool</td><td><code>tools/page1_gate.py</code></td><td>from TASK-001</td></tr><tr><td>Target tree</td><td><code>StudyHub/TN/10th/Science/PYQ/Annual/&lt;year&gt;/</code></td><td>to be created</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Create the target folders (one per year, 2022–2026) under <code>StudyHub/TN/10th/Science/PYQ/Annual/</code>.</li>\n<li>Download each source file to <code>/tmp</code>, compute md5, compare against <code>COLLECT_LOG.csv</code> (mismatch = stop and report, do not publish).</li>\n<li>Run <code>tools/page1_gate.py</code> on each file. Expect PASS (page 1 = அறிவியல்/Science). Any FAIL or REVIEW → do not publish that file; move a copy to <code>StudyHub/_QUARANTINE/</code> and report it.</li>\n<li>Publish each PASS file to its year folder as a <strong>copy</strong> — the original stays exactly where it is. Name it <code>10_Science_Annual_&lt;year&gt;_STATE.pdf</code>.</li>\n<li>Upload pattern per file: <code>replace → verify by list → upload → verify by list</code> (<code>replace</code> no-ops if the name is new — that is expected, but you must still verify).</li>\n<li>Append rows to <code>ledgers/publish_log.csv</code> (old path + new path + md5 + shelf <code>free</code>) and rows to <code>ledgers/gate_results.csv</code>.</li>\n<li>Paste all five Drive links into <code>agents/agent-01/log.md</code>.</li>\n</ol>\n<h2>Deliverables (exact names)</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_Annual_2022_STATE.pdf</code> … <code>10_Science_Annual_2026_STATE.pdf</code> (5 files)</td><td><code>StudyHub/TN/10th/Science/PYQ/Annual/&lt;year&gt;/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Five files in five year folders. Ravi opens any one of them on his phone and page 1 says Science (அறிவியல்), not Tamil. Links are in the log. <strong>Then stop</strong> — do not continue into district files, do not start Maths.</p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0 + §6 (upload/naming). Originals are not watermarked — confirm you did not add anything to them.</p>\n<h2>Techniques</h2>\n<p>Page-1 gate (OFFICE.md §5.2) · md5 duplicate control (§5.3) · <code>bridge.py</code> <code>/text/plain</code> / ≥180 s / ≤8 MB / 4 workers / replace-verify pattern (§5.1) · ledgers in <code>ledgers/</code> (§5.8, <code>ledgers/README.md</code>) · naming (§5.9) · quarantine instead of delete (§5.10).</p>","path":"tasks/archive/2026-09-23-round1/TASK-002-publish-sslc-science.md"},{"slug":"TASK-003-verify-quarterly-halfyearly","id":"TASK-003","title":"Verify and publish 10th Quarterly + Half-Yearly Science","lane":"PYQ (agent-01)","priority":"1 (Class 10 Science)","shelf":"free","blocked_by":"TASK-001, TASK-002","owner_approval":"no (gate handles the decisions; quarantine list goes in the report)","estimate":"2 agent sessions","stop_condition":"Every file in the two source folders has a gate row; the PASS set is on Drive; the REVIEW and FAIL lists are written with links. **Stop after Science** — Maths is TASK-004.","why":"The debrief records that Question Papers/10th/Quarterly/2026/STATE/ holds four files named Science, all of which are suspect, and the district quarterlies are listing-harvest material of unknown subject. Unique Quarter/Half-Yearly papers are worth more to a s…","html":"<h1>TASK-003 — Verify and publish 10th Quarterly + Half-Yearly Science</h1>\n<p>Lane: PYQ (agent-01) Priority: 1 (Class 10 Science) Shelf: free Blocked by: TASK-001, TASK-002 Owner approval needed: no (gate handles the decisions; quarantine list goes in the report) Estimate: 2 agent sessions</p>\n<h2>Why this task</h2>\n<p>The debrief records that <code>Question Papers/10th/Quarterly/2026/STATE/</code> holds four files named Science, all of which are suspect, and the district quarterlies are listing-harvest material of unknown subject. Unique Quarter/Half-Yearly papers are worth more to a student than another Annual — but only the gated ones.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>10th Quarterly 2026 STATE files</td><td><code>Question Papers/10th/Quarterly/2026/STATE/</code></td><td><strong>known contaminated</strong> (four \"Science\" files, one reportedly Tamil)</td></tr><tr><td>District quarterlies (10th)</td><td><code>Question Papers/10th/Quarterly/2025/&lt;District&gt;/</code></td><td>untrusted</td></tr><tr><td>Half-Yearly (10th)</td><td><code>Question Papers/10th/Half-Yearly/**</code></td><td>partially explored</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li><code>list</code> each folder (one path at a time — never <code>tree</code> the vault).</li>\n<li>Download each candidate to <code>/tmp</code>; md5 it; run the page-1 gate.</li>\n<li>Deduplicate by md5 across the whole set — the same paper under three names is one paper.</li>\n<li>Publish PASS files only, as copies, into <code>StudyHub/TN/10th/Science/PYQ/{Quarterly|HalfYearly}/&lt;year&gt;/</code>, names <code>10_Science_&lt;Exam&gt;_&lt;year&gt;_&lt;District|STATE&gt;.pdf</code> (district stays in the filename and as a ledger column — <strong>never</strong> a folder inside StudyHub).</li>\n<li>REVIEW files → leave in place, list them for the owner with Drive links.</li>\n<li>FAIL files → copy to <code>StudyHub/_QUARANTINE/</code>, log why.</li>\n<li>Ledgers: <code>gate_results.csv</code>, <code>publish_log.csv</code>, and <code>duplicates.csv</code> for every md5 collision.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td>gated <code>&lt;class&gt;_Science_&lt;Exam&gt;_&lt;year&gt;_&lt;source&gt;.pdf</code> set</td><td><code>StudyHub/TN/10th/Science/PYQ/Quarterly/&lt;year&gt;/</code> and <code>…/HalfYearly/&lt;year&gt;/</code></td></tr><tr><td>quarantine list + REVIEW list</td><td><code>agents/agent-01/log.md</code> (with Drive links)</td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Every file in the two source folders has a gate row; the PASS set is on Drive; the REVIEW and FAIL lists are written with links. <strong>Stop after Science</strong> — Maths is TASK-004.</p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0 + §6. Extra: every published file's name must match its gated subject.</p>\n<h2>Techniques</h2>\n<p>§5.2 gate, §5.3 md5, §5.1 upload pattern, §5.10 quarantine. District-as-column rule (§5.10). Do not re-download anything already published in TASK-002.</p>","path":"tasks/archive/2026-09-23-round1/TASK-003-verify-quarterly-halfyearly.md"},{"slug":"TASK-004-class10-maths-gated-set","id":"TASK-004","title":"Class 10 Maths: build one gated unique set (5 years)","lane":"PYQ (agent-01)","priority":"2 (Class 10 Maths)","shelf":"free","blocked_by":"TASK-001, TASK-002 (technique proven first)","owner_approval":"no","estimate":"2–3 agent sessions","stop_condition":"Maths has 5 year folders, each with a page-1-verified paper (or an explicit REVIEW note saying why not). Ravi opens Maths and sees Maths.","why":"Maths is the second-most demanded subject and nothing is verified for it — the Maths agent's SSLC splits may or may not exist and must not be assumed. Maths papers are also the easiest to identify from page 1 (formulae, figure boxes, கணிதம்).","html":"<h1>TASK-004 — Class 10 Maths: build one gated unique set (5 years)</h1>\n<p>Lane: PYQ (agent-01) Priority: 2 (Class 10 Maths) Shelf: free Blocked by: TASK-001, TASK-002 (technique proven first) Owner approval needed: no Estimate: 2–3 agent sessions</p>\n<h2>Why this task</h2>\n<p>Maths is the second-most demanded subject and <strong>nothing is verified for it</strong> — the Maths agent's SSLC splits may or may not exist and must not be assumed. Maths papers are also the easiest to identify from page 1 (formulae, figure boxes, கணிதம்).</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>DGE all-subject bundles</td><td><code>COLLECT/GOVT_PYQ/SSLC_{2022..2026}_*_ALL.pdf</code></td><td><strong>in the workspace, persists</strong></td></tr><tr><td>Page tables</td><td><code>COLLECT/READ_THIS_FIRST.md</code> + <code>tools/README.md</code> §2</td><td>known, year-specific</td></tr><tr><td>Possible prior work</td><td><code>Question Papers/10th/Annual/&lt;year&gt;/STATE/</code></td><td>unverified, check by <code>list</code> first</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>First <code>list</code> <code>Question Papers/10th/Annual/{2022..2026}/STATE/</code> — if Maths splits already exist, gate them and publish instead of re-splitting (never redo finished work).</li>\n<li>Where missing: split the Maths page range from the DGE bundle (<code>COLLECT/READ_THIS_FIRST.md</code> page table; 1-based start, exclusive end). <strong>Open page 1 of every split output and confirm it is கணிதம்/Maths</strong> — 2022 has a different layout from later years.</li>\n<li>Gate each split (TASK-001 tool), md5, then publish as <code>10_Maths_Annual_&lt;year&gt;_STATE.pdf</code> into <code>StudyHub/TN/10th/Maths/PYQ/Annual/&lt;year&gt;/</code>.</li>\n<li>Medium: keep the Tamil+English version once, <code>medium=Both</code>, <code>district=STATE</code>.</li>\n<li>Ledgers + log with links.</li>\n<li>If a year's Maths pages cannot be identified confidently, log REVIEW for that year and move on — do not guess and do not \"improve\" the split.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Maths_Annual_&lt;year&gt;_STATE.pdf</code> (up to 5)</td><td><code>StudyHub/TN/10th/Maths/PYQ/Annual/&lt;year&gt;/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Maths has 5 year folders, each with a page-1-verified paper (or an explicit REVIEW note saying why not). Ravi opens Maths and sees Maths.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §6 universal/upload. Add: confirm the split's first and last pages both belong to Maths (page table off-by-one is a known risk).</p>\n<h2>Techniques</h2>\n<p>DGE splitting (<code>tools/README.md</code> §2), page-1 gate, md5, publish-as-copy, ledgers. <strong>No district harvesting for Maths until a STATE set exists.</strong></p>","path":"tasks/archive/2026-09-23-round1/TASK-004-class10-maths-gated-set.md"},{"slug":"TASK-005-class10-social-gated-set","id":"TASK-005","title":"Class 10 Social Science: gated unique set","lane":"PYQ (agent-01)","priority":"3 (Class 10 Social)","shelf":"free","blocked_by":"TASK-001","owner_approval":"no","estimate":"2–3 agent sessions","stop_condition":"Social has a gated set (or an explicit list of which years could not be sourced and why). The folder names and file names are exactly as above — the app's chips read these names.","why":"Social is where a OneWord bank (TASK-009 lineage) pays off fastest, but the PYQ shelf must exist first. Social/சமூக அறிவியல் papers are identifiable from page 1 by the subject heading and by the History/Geography/Civics/Economics section split.","html":"<h1>TASK-005 — Class 10 Social Science: gated unique set</h1>\n<p>Lane: PYQ (agent-01) Priority: 3 (Class 10 Social) Shelf: free Blocked by: TASK-001 Owner approval needed: no Estimate: 2–3 agent sessions</p>\n<h2>Why this task</h2>\n<p>Social is where a OneWord bank (TASK-009 lineage) pays off fastest, but the PYQ shelf must exist first. Social/சமூக அறிவியல் papers are identifiable from page 1 by the subject heading and by the History/Geography/Civics/Economics section split.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>DGE bundles</td><td><code>COLLECT/GOVT_PYQ/</code></td><td>available</td></tr><tr><td>Possible prior work</td><td><code>Question Papers/10th/Annual/&lt;year&gt;/STATE/</code>, district quarterlies</td><td>unverified</td></tr><tr><td>Note from the debrief</td><td>Social one-word work was a different agent's thread; no Social PDFs were to be started there</td><td>so assume nothing exists</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li><code>list</code> the Annual STATE year folders for anything Social.</li>\n<li>Split Social pages from the DGE bundles where needed; confirm <strong>both</strong> that page 1 is சமூக அறிவியல்/Social Science and that the paper contains the four-section structure.</li>\n<li>Gate → md5 → publish as <code>10_SocialScience_Annual_&lt;year&gt;_STATE.pdf</code> into <code>StudyHub/TN/10th/SocialScience/PYQ/Annual/&lt;year&gt;/</code>.</li>\n<li>Watch the trap: Social pages in some bundles carry a state-map or a table of contents page with all subjects listed — if the gate returns REVIEW, do not publish it; check the next page and record what you saw.</li>\n<li>Ledgers + links.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_SocialScience_Annual_&lt;year&gt;_STATE.pdf</code></td><td><code>StudyHub/TN/10th/SocialScience/PYQ/Annual/&lt;year&gt;/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Social has a gated set (or an explicit list of which years could not be sourced and why). The folder names and file names are exactly as above — the app's chips read these names.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §6.</p>\n<h2>Techniques</h2>\n<p>§5.2 gate (with the contents-page trap), §5.3 md5, §5.1 upload, ledgers. Folder naming must match the app's subject slugs — <code>SocialScience</code> (one word, capital S).</p>","path":"tasks/archive/2026-09-23-round1/TASK-005-class10-social-gated-set.md"},{"slug":"TASK-006-class10-tamil-gated-set","id":"TASK-006","title":"Class 10 Tamil: gated unique set (the medium trap)","lane":"PYQ (agent-01)","priority":"4 (Class 10 Tamil/English)","shelf":"free","blocked_by":"TASK-001","owner_approval":"no","estimate":"2–3 agent sessions","stop_condition":"The Tamil shelf contains only files whose page 1 is a Tamil paper, and the reclamation count is written down. **The stop condition Ravi cares about: nothing named Tamil opens as Science, and vice versa.**","why":"Tamil is the subject where the team failed hardest: files named Science were Tamil papers. Tamil must be identified by the paper's own structure — இயல்/section headings, தமிழ் subject line, prose + grammar + literature split — not by the language of the text…","html":"<h1>TASK-006 — Class 10 Tamil: gated unique set (the medium trap)</h1>\n<p>Lane: PYQ (agent-01) Priority: 4 (Class 10 Tamil/English) Shelf: free Blocked by: TASK-001 Owner approval needed: no Estimate: 2–3 agent sessions</p>\n<h2>Why this task</h2>\n<p>Tamil is the subject where the team failed hardest: files <em>named</em> Science were Tamil papers. Tamil must be identified by the paper's own structure — இயல்/section headings, தமிழ் subject line, prose + grammar + literature split — not by the language of the text (every Tamil-medium paper is Tamil text).</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>DGE bundles</td><td><code>COLLECT/GOVT_PYQ/</code></td><td>available</td></tr><tr><td>Known contaminated set</td><td><code>Question Papers/10th/Quarterly/2026/STATE/</code> (four \"Science\" files, at least one Tamil)</td><td>must be re-gated</td></tr><tr><td>Suspect district dumps</td><td><code>Question Papers/10th/Quarterly/*/</code>, `…/8th</td><td>9th/Quarterly/2025/*`</td><td>the Science-labelled ones may be Tamil — check</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Gate every file that was <em>named</em> Science but whose page 1 is Tamil <strong>first</strong> — those are the highest-value reclamations (they may be perfectly good Tamil papers we could rescue into the Tamil shelf).</li>\n<li>For genuine Tamil papers: publish as <code>10_Tamil_&lt;Exam&gt;_&lt;year&gt;_&lt;source&gt;.pdf</code> into <code>StudyHub/TN/10th/Tamil/PYQ/&lt;Exam&gt;/&lt;year&gt;/</code>.</li>\n<li>Medium column: <code>Tamil</code>. Tamil-medium papers are the core product for this subject.</li>\n<li>Where a Tamil <em>paper</em> was mislabelled Science, publish it under Tamil with a ledger note recording the old name (so nobody re-creates it).</li>\n<li>Never rename a file in the old vault. Copy, publish, log.</li>\n<li>Ledgers + links; the log entry must say how many mislabelled files were reclaimed.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td>reclaimed + sourced <code>10_Tamil_*</code> set</td><td><code>StudyHub/TN/10th/Tamil/PYQ/&lt;Exam&gt;/&lt;year&gt;/</code></td></tr><tr><td>reclamation note</td><td><code>agents/agent-01/log.md</code> + <code>ledgers/gate_results.csv</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>The Tamil shelf contains only files whose page 1 is a Tamil paper, and the reclamation count is written down. <strong>The stop condition Ravi cares about: nothing named Tamil opens as Science, and vice versa.</strong></p>\n<h2>Checklist to run</h2>\n<p>§0 + §6.</p>\n<h2>Techniques</h2>\n<p>§5.2 gate with the Tamil subject-token list (<code>தமிழ்</code> = the subject; do not confuse with medium) · §5.3 md5 (mislabelled duplicates are common) · §5.10 quarantine for failures · district-as-column.</p>","path":"tasks/archive/2026-09-23-round1/TASK-006-class10-tamil-gated-set.md"},{"slug":"TASK-007-class10-english-gated-set","id":"TASK-007","title":"Class 10 English: gated unique set","lane":"PYQ (agent-01)","priority":"4 (Class 10 Tamil/English)","shelf":"free","blocked_by":"TASK-001","owner_approval":"no","estimate":"1–2 agent sessions","stop_condition":"With TASK-002, 004, 005, 006 done, Class 10 has **five subjects × up to five years** of page-1-verified papers in the free shelf. That is the Week-1 success metric and it is reportable to Ravi in one line.","why":"English-medium papers are the easiest to gate (Prose/Poem/Supplementary/ Grammar sections are unambiguous) and they complete the five-subject Week-1 set — the thing the whole freeze was about.","html":"<h1>TASK-007 — Class 10 English: gated unique set</h1>\n<p>Lane: PYQ (agent-01) Priority: 4 (Class 10 Tamil/English) Shelf: free Blocked by: TASK-001 Owner approval needed: no Estimate: 1–2 agent sessions</p>\n<h2>Why this task</h2>\n<p>English-medium papers are the easiest to gate (Prose/Poem/Supplementary/ Grammar sections are unambiguous) and they complete the five-subject Week-1 set — the thing the whole freeze was about.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>DGE bundles</td><td><code>COLLECT/GOVT_PYQ/</code></td><td>available</td></tr><tr><td>Suspect sets</td><td>Annual STATE year folders, district quarterlies</td><td>unverified</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li><code>list</code> for existing English files; gate what exists before downloading anything.</li>\n<li>Split English pages from the DGE bundles where needed; confirm page 1 shows English paper structure (Prose / Poem / Grammar, Part I–IV, 100 marks).</li>\n<li>Publish as <code>10_English_Annual_&lt;year&gt;_STATE.pdf</code> into <code>StudyHub/TN/10th/English/PYQ/Annual/&lt;year&gt;/</code>.</li>\n<li>Note: English-medium <em>Science</em> papers are not English papers — the gate's subject column is the subject, the medium column is separate. Do not file a Science-English paper into the English shelf.</li>\n<li>Ledgers + links.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_English_Annual_&lt;year&gt;_STATE.pdf</code></td><td><code>StudyHub/TN/10th/English/PYQ/Annual/&lt;year&gt;/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>With TASK-002, 004, 005, 006 done, Class 10 has <strong>five subjects × up to five years</strong> of page-1-verified papers in the free shelf. That is the Week-1 success metric and it is reportable to Ravi in one line.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §6.</p>\n<h2>Techniques</h2>\n<p>§5.2 (subject vs medium distinction), §5.3 md5, §5.1 upload, ledgers, naming.</p>","path":"tasks/archive/2026-09-23-round1/TASK-007-class10-english-gated-set.md"},{"slug":"TASK-008-recover-models-keys","id":"TASK-008","title":"Recover the existing 10th model papers + answer keys","lane":"MODEL (agent-02)","priority":"1 (Class 10, free shelf)","shelf":"free","blocked_by":"TASK-001","owner_approval":"no","estimate":"2 agent sessions","stop_condition":"Every recoverable model+key is on Drive in `Models/` and the inventory is written. **Stop before creating anything new.**","why":"The team already made 10th Maths/Science model papers and keys. They were deleted from the local workspace during the 23 Sep cleanup and may still exist on Drive . Regenerating them would waste sessions and create a second, conflicting version. Free shelf = P…","html":"<h1>TASK-008 — Recover the existing 10th model papers + answer keys</h1>\n<p>Lane: MODEL (agent-02) Priority: 1 (Class 10, free shelf) Shelf: free Blocked by: TASK-001 Owner approval needed: no Estimate: 2 agent sessions</p>\n<h2>Why this task</h2>\n<p>The team already made 10th Maths/Science model papers and keys. They were deleted from the local workspace during the 23 Sep cleanup and <strong>may still exist on Drive</strong>. Regenerating them would waste sessions and create a second, conflicting version. Free shelf = PYQ + models + model keys, so this is half the free product.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Possible model papers + keys</td><td><code>Question Papers/10th/<strong></code> year folders, <code>Unknown/</code>, <code>WITHKEY/</code>, <code>2UP-A4/</code>, <code>Print-Ready/</code>, <code>Study Materials/</strong></code></td><td>unknown — search one path at a time</td></tr><tr><td>Suspect naming</td><td><code>*_A5.pdf</code>, <code><em>MODEL</em></code>, <code><em>KEY</em></code>, <code><em>answer</em></code>, <code><em>model</em></code></td><td>old factory output, subject trust unknown</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Search by <code>list</code> folder-by-folder (never <code>tree</code> the vault): Annual year folders first, then Quarterly, then <code>Study Materials/</code>, then any <code>_catalog</code>/<code>_old_root</code>-era paths.</li>\n<li>For every candidate: download, md5, gate page 1 for subject, and open the key file to confirm it is a key for that paper (not another paper).</li>\n<li>Publish as copies into <code>StudyHub/TN/10th/&lt;Subject&gt;/Models/</code>: <code>10_&lt;Subject&gt;_Model_&lt;n&gt;_&lt;medium&gt;.pdf</code> and <code>10_&lt;Subject&gt;_Model_&lt;n&gt;_&lt;medium&gt;_KEY.pdf</code>.</li>\n<li>Write the inventory: found / missing / unusable, one line per file with its Drive link — into <code>agents/agent-02/log.md</code>. This inventory is what tells the Manager whether new models are needed at all.</li>\n<li>Only after the inventory: list the gaps (subjects/units with no model) as a comment in <code>current.md</code>, do <strong>not</strong> start creating them — creation is a separate task (TASK-017).</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td>recovered <code>10_*_Model_*</code> + <code>*_KEY</code> set</td><td><code>StudyHub/TN/10th/&lt;Subject&gt;/Models/</code></td></tr><tr><td>inventory (found / missing / unusable + links)</td><td><code>agents/agent-02/log.md</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Every recoverable model+key is on Drive in <code>Models/</code> and the inventory is written. <strong>Stop before creating anything new.</strong></p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0, §5 (paper standards), §6 (upload). A key that is just a list of answers is a FAIL against §5 — publish it as a draft note only if it is the only copy, and flag it.</p>\n<h2>Techniques</h2>\n<p>§5.2 gate, §5.3 md5, §5.1 upload, §5.10 quarantine for dirty/foreign-branded files. Do not re-brand originals — the FACTORY lane makes print copies later.</p>","path":"tasks/archive/2026-09-23-round1/TASK-008-recover-models-keys.md"},{"slug":"TASK-009-oneword-science-mcq-json","id":"TASK-009","title":"10th Science one-word bank Ch 1–3 + matching MCQ JSON","lane":"ONEWORD/QBANK (agent-03)","priority":"1 (Class 10 Science)","shelf":"**topper** (never free)","blocked_by":"TASK-001","owner_approval":"no","estimate":"2–3 agent sessions","stop_condition":"One chapter range, two matching files, on Drive, in the **Topper** folder — and nothing in the free shelf. Ravi opens the PDF and sees a clean one-word bank for the first three chapters.","why":"One-word banks are the first real Topper-shelf product and the same JSON becomes the Centum \"Take this as a test\" player later. The debrief says one-word Science/Social booklets were \"said to exist\" but are not in the workspace — so check Drive first , then e…","html":"<h1>TASK-009 — 10th Science one-word bank Ch 1–3 + matching MCQ JSON</h1>\n<p>Lane: ONEWORD/QBANK (agent-03) Priority: 1 (Class 10 Science) Shelf: <strong>topper</strong> (never free) Blocked by: TASK-001 Owner approval needed: no Estimate: 2–3 agent sessions</p>\n<h2>Why this task</h2>\n<p>One-word banks are the first real Topper-shelf product and the same JSON becomes the Centum \"Take this as a test\" player later. The debrief says one-word Science/Social booklets were \"said to exist\" but are not in the workspace — so <strong>check Drive first</strong>, then extend or create.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Existing one-word booklets?</td><td>Drive — old vault year folders, <code>Study Materials/</code>, any <code>*ONE*WORD*</code>/<code><em>_ONEWORD_</em></code></td><td>unverified — search before building</td></tr><tr><td>Question source</td><td>SSLC Science text-book chapters + gated PYQ (from TASK-002)</td><td>textbook content is the base</td></tr><tr><td>JSON schema</td><td><code>training/content-standards.md</code> §5</td><td>must be followed exactly</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Search Drive for an existing one-word bank for 10th Science. If found: gate, publish to <code>StudyHub/TN/10th/Science/OneWord/</code>, and extend only the missing chapters.</li>\n<li>Build chapters 1–3 (Science, Class 10): one-word/MCQ questions from the chapter content. Every question: 4 options a–d, one correct, plausible distractors, plus a one-line explanation.</li>\n<li>Produce two shapes from the same set:</li>\n<ul class='nested'>\n<li>printable A5 booklet <code>10_Science_OneWord_Ch01-03_A5.pdf</code> (answers at the end of each chapter, not inline)</li>\n<li><code>10_Science_OneWord_Ch01-03.json</code> with the exact schema, <code>shelf: \"topper\"</code>, <code>source: \"book-back|lesson\"</code>.</li>\n</ul>\n<li><strong>Count check:</strong> booklet question count == JSON object count. Record the number in <code>log.md</code>. If they differ the task is failed.</li>\n<li>Verify 100% of answer indices against the text — not against the pattern of your own options (this is the highest-risk error class in this task).</li>\n<li>Upload to <code>StudyHub/TN/10th/Science/OneWord/</code> via the standard upload pattern; ledgers; links in <code>log.md</code>.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_OneWord_Ch01-03_A5.pdf</code></td><td><code>StudyHub/TN/10th/Science/OneWord/</code></td></tr><tr><td><code>10_Science_OneWord_Ch01-03.json</code></td><td><code>StudyHub/TN/10th/Science/OneWord/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>One chapter range, two matching files, on Drive, in the <strong>Topper</strong> folder — and nothing in the free shelf. Ravi opens the PDF and sees a clean one-word bank for the first three chapters.</p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0 + §1 (question bank) — every item, including the JSON-validity and count-equality items.</p>\n<h2>Techniques</h2>\n<p>§5.1 upload pattern, §5.8 ledgers, §5.9 naming, §5.2 only if the questions come from PYQ-sourced material. <strong>Shelf discipline: Topper material never enters <code>PYQ/</code> and never appears in a free listing.</strong> JSON is the shared artifact with the Centum player — no second format.</p>","path":"tasks/archive/2026-09-23-round1/TASK-009-oneword-science-mcq-json.md"},{"slug":"TASK-010-qbank-science-ch1","id":"TASK-010","title":"10th Science chapter 1 question bank (all types) + mark scheme","lane":"ONEWORD/QBANK (agent-03)","priority":"1 (Class 10 Science)","shelf":"**topper**","blocked_by":"TASK-001","owner_approval":"no","estimate":"2 agent sessions","stop_condition":"One chapter, all bands, answers markable, PDF+JSON counts equal, on Drive in the Topper folder. **Do not start chapter 2** — the next chapter is a separate task so quality can be judged on one before scaling to fifteen.","why":"The one-word bank (TASK-009) covers knowledge recall. This gives the student every mark-band question for a chapter with markable answers — the artifact that makes Topper worth ₹499, and the source for the model paper (TASK-017).","html":"<h1>TASK-010 — 10th Science chapter 1 question bank (all types) + mark scheme</h1>\n<p>Lane: ONEWORD/QBANK (agent-03) Priority: 1 (Class 10 Science) Shelf: <strong>topper</strong> Blocked by: TASK-001 Owner approval needed: no Estimate: 2 agent sessions</p>\n<h2>Why this task</h2>\n<p>The one-word bank (TASK-009) covers knowledge recall. This gives the student every mark-band question for a chapter with markable answers — the artifact that makes Topper worth ₹499, and the source for the model paper (TASK-017).</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>SSLC Science textbook chapter 1</td><td>in hand / Drive study materials</td><td>base source</td></tr><tr><td>Book-back + exercise questions</td><td>textbook</td><td>must all be accounted for</td></tr><tr><td>Gated PYQ (Science 2022–2026)</td><td><code>StudyHub/TN/10th/Science/PYQ/</code> after TASK-002</td><td>reuse real exam questions</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Build the chapter's complete question list, grouped exactly: one-word · 2-mark · 3-mark · 5-mark · diagram/map.</li>\n<li>Include question wording from the textbook/board where it exists — do not rewrite official questions.</li>\n<li>Write answers with <strong>marking points in the order a teacher ticks them</strong>; 2-mark = 2 points, 3-mark = 3, 5-mark = 5 + a diagram note where a diagram earns marks.</li>\n<li>Flag any question whose answer depends on a diagram: name the diagram and its labels.</li>\n<li>Produce <code>10_Science_QBank_Ch01_A5.pdf</code> (answers after the questions, per mark band) and <code>10_Science_QBank_Ch01.json</code> (same content, schema per <code>content-standards.md</code> §5, <code>type</code> per band).</li>\n<li>Counts must match between PDF and JSON; write the counts in <code>log.md</code>.</li>\n<li>Upload to <code>StudyHub/TN/10th/Science/QBank/</code>; ledger rows; links.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_QBank_Ch01_A5.pdf</code></td><td><code>StudyHub/TN/10th/Science/QBank/</code></td></tr><tr><td><code>10_Science_QBank_Ch01.json</code></td><td><code>StudyHub/TN/10th/Science/QBank/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>One chapter, all bands, answers markable, PDF+JSON counts equal, on Drive in the Topper folder. <strong>Do not start chapter 2</strong> — the next chapter is a separate task so quality can be judged on one before scaling to fifteen.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §1 in full.</p>\n<h2>Techniques</h2>\n<p>§5.1 upload, §5.8 ledgers, §5.9 naming, Topper folder discipline. If a question is sourced from a PYQ file, record its year in the JSON <code>source</code> field.</p>","path":"tasks/archive/2026-09-23-round1/TASK-010-qbank-science-ch1.md"},{"slug":"TASK-011-rebuild-2up-pipeline","id":"TASK-011","title":"Rebuild the 2-up print pipeline without `papers/manifest.json`","lane":"FACTORY (agent-04)","priority":"1 (blocks every print deliverable)","shelf":"n/a (production step)","blocked_by":"TASK-001 (only gated files get printed)","owner_approval":"no","estimate":"1–2 agent sessions","stop_condition":"Three files on Drive from one source paper, produced in one command each, with page order and watermark direction confirmed by opening the PDFs. **One paper only — no batch run.**","why":"qp 2up.py needs brand booklet.process file and papers/manifest.json — both lived in a workspace tree that no longer exists and must never be rebuilt. Until this is fixed, no print file can be produced reliably, and every \"print-ready\" claim in the old vault i…","html":"<h1>TASK-011 — Rebuild the 2-up print pipeline without <code>papers/manifest.json</code></h1>\n<p>Lane: FACTORY (agent-04) Priority: 1 (blocks every print deliverable) Shelf: n/a (production step) Blocked by: TASK-001 (only gated files get printed) Owner approval needed: no Estimate: 1–2 agent sessions</p>\n<h2>Why this task</h2>\n<p><code>qp_2up.py</code> needs <code>brand_booklet.process_file</code> and <code>papers/manifest.json</code> — both lived in a workspace tree that no longer exists and must never be rebuilt. Until this is fixed, no print file can be produced reliably, and every \"print-ready\" claim in the old vault is unverifiable.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Old 2-up script</td><td><code>qp_2up.py</code> (workspace root / <code>tools/</code>)</td><td>fragile, path-dependent</td></tr><tr><td>Known-good output examples</td><td>old vault <code>2UP-A4/</code>, <code>Print-Ready/</code> folders</td><td>reference for layout only — not subject-trusted</td></tr><tr><td>Gate tool</td><td><code>tools/page1_gate.py</code></td><td>from TASK-001</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Read <code>qp_2up.py</code> and list every external dependency it has. Remove/replace each one — no new dependency may point into <code>papers/</code>.</li>\n<li>New interface: <code>python3 tools/qp_2up.py --in &lt;file.pdf&gt; --out &lt;file_2UP_A4.pdf&gt; [--brand] [--wm]</code> and optionally <code>--drive-folder \"&lt;StudyHub path&gt;\"</code> to process a whole folder.</li>\n<li>Requirements: input is A5 (or is scaled to A5 at true size, never stretched); two A5 slots per A4; <strong>one watermark per A5 slot</strong>; cut-ready; page order verified by opening the output.</li>\n<li>Output naming: <code>&lt;original-stem&gt;_2UP_A4.pdf</code>, and <code>_A5.pdf</code> for the branded single-slot version.</li>\n<li>Run it on <strong>one</strong> gated Science paper to produce the sample set: A5 branded, 2-up A4, WM applied. Upload the samples to <code>StudyHub/TN/10th/Science/_print/</code>.</li>\n<li>Write the header comment block (<code>tools/README.md</code> §6) and commit the script to <code>tools/</code>.</li>\n<li>Update <code>ledgers/wm_done.json</code> schema usage if you touched the WM path, and record the resume-index practice.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Where</th></tr></thead><tbody><tr><td><code>tools/qp_2up.py</code></td><td>committed to repo, dependency-free</td></tr><tr><td><code>10_Science_Annual_2026_STATE_A5.pdf</code></td><td><code>StudyHub/TN/10th/Science/_print/</code></td></tr><tr><td><code>10_Science_Annual_2026_STATE_2UP_A4.pdf</code></td><td><code>StudyHub/TN/10th/Science/_print/</code></td></tr><tr><td>all three sample variants (incl. WM) + links</td><td><code>agents/agent-04/log.md</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Three files on Drive from one source paper, produced in one command each, with page order and watermark direction confirmed by opening the PDFs. <strong>One paper only — no batch run.</strong></p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0 + §7 (factory/print).</p>\n<h2>Techniques</h2>\n<p>§5.6 WM (BL→TR, 0.17, vector page over the scan, one per A5 slot, student copy only) · §5.5 strip rules if the source still carries a third-party mark · §5.7 print rules · §5.8 ledgers in repo · §5.1 upload pattern (≤8 MB — a 2-up of a long paper can exceed this; split by chapter or re-export lower DPI).</p>","path":"tasks/archive/2026-09-23-round1/TASK-011-rebuild-2up-pipeline.md"},{"slug":"TASK-012-finish-class8-watermark","id":"TASK-012","title":"Finish the Class 8 watermark run (98/444) + recheck the pre-fix files","lane":"FACTORY (agent-04)","priority":"6 (Class 8 — but it is a paused, half-done job; finishing it stops it leaking into future runs)","shelf":"topper/print","blocked_by":"TASK-011 (WM must be applied by the rebuilt, verified path)","owner_approval":"**yes** — this writes to the old vault; the owner must confirm the freeze is lifted for it","estimate":"2–3 sessions (batched)","stop_condition":"All 444 files either carry one consistent watermark or are on the skipped list with a reason. The skipped list is in the log.","why":"A batch job stopped at file 98 of 444 during the freeze, and files 1–98 were watermarked with the pre-2026-09-16 negative angle . Right now the vault contains two different watermark directions — which is exactly the kind of inconsistency that makes a parent…","html":"<h1>TASK-012 — Finish the Class 8 watermark run (98/444) + recheck the pre-fix files</h1>\n<p>Lane: FACTORY (agent-04) Priority: 6 (Class 8 — but it is a paused, half-done job; finishing it stops it leaking into future runs) Shelf: topper/print Blocked by: TASK-011 (WM must be applied by the rebuilt, verified path) Owner approval needed: <strong>yes</strong> — this writes to the old vault; the owner must confirm the freeze is lifted for it Estimate: 2–3 sessions (batched)</p>\n<h2>Why this task</h2>\n<p>A batch job stopped at file 98 of 444 during the freeze, and files 1–98 were watermarked with the <strong>pre-2026-09-16 negative angle</strong>. Right now the vault contains two different watermark directions — which is exactly the kind of inconsistency that makes a parent distrust the brand.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Job ledger</td><td><code>ledgers/wm_done.json</code></td><td>records 1–98 done-pre-fix, resume at 99</td></tr><tr><td>Target files</td><td>Drive <code>Question Papers/8th/Quarterly/*</code> (444 files)</td><td>partially watermarked</td></tr><tr><td>WM tool</td><td><code>wm_apply.py</code> (<code>fix_direction()</code> strips ours and reapplies)</td><td>direction fixed 2026-09-16</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Batch 1 (recheck): run <code>fix_direction()</code> over files 1–98 — it must strip our old mark and reapply at BL→TR, opacity 0.17. Verify 3 random files by opening them.</li>\n<li>Batch 2 (finish): resume at index 99 and run in batches of 25–50 with 4 workers, <code>MIN_GAP = 0.25 s</code>.</li>\n<li>After <strong>every batch</strong>: write the resume index to <code>ledgers/wm_done.json</code>, append a <code>log.md</code> line with the file range, and <code>list</code> a sample to confirm the upload landed.</li>\n<li>Never touch <code>_INBOX</code> originals. Never watermark a Drive original — the student-facing copy only.</li>\n<li>If a file exceeds 8 MB or fails the bridge twice, log it as SKIPPED with its path; do not retry it forever.</li>\n<li>Final: one summary line — X rechecked, Y newly watermarked, Z skipped, with the count in <code>log.md</code>.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th></tr></thead><tbody><tr><td>Class 8 set watermarked consistently (BL→TR, 0.17)</td><td>existing folder in the old vault, student copies only</td></tr><tr><td>updated resume/ledger state</td><td><code>ledgers/wm_done.json</code> + <code>agents/agent-04/log.md</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>All 444 files either carry one consistent watermark or are on the skipped list with a reason. The skipped list is in the log.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §7.</p>\n<h2>Techniques</h2>\n<p>§5.6 (<code>fix_direction()</code>, one WM per A5 slot, vector overlay, no re-encode) · §5.1 (4 workers, 0.25 s gap, 180 s timeouts, replace-verify) · §5.8 (ledger in repo — the old ledger was wiped, this is why) · <strong>no deletes, no renames, no restructuring.</strong></p>","path":"tasks/archive/2026-09-23-round1/TASK-012-finish-class8-watermark.md"},{"slug":"TASK-013-topper-notes-science-unit1","id":"TASK-013","title":"10th Science: Topper Notes, Unit 1 (exam-directed)","lane":"ONEWORD/QBANK (agent-03) — notes are produced from the banks, so the same lane owns them","priority":"1 (Class 10 Science)","shelf":"**topper**","blocked_by":"TASK-010 (the chapter Q-bank defines what the notes must cover)","owner_approval":"no","estimate":"2–3 agent sessions","stop_condition":"One unit's Topper Notes on Drive, in a Notes folder, following the layout rules — and every factual claim checked against the textbook. **One unit only.**","why":"Topper Notes are what the parent is paying for and what the free shelf must never show. They are not \"shorter complete notes\" — they are what the examiner ticks: verbatim definitions, formulae, mark splits, model answers, and the traps that cost marks.","html":"<h1>TASK-013 — 10th Science: Topper Notes, Unit 1 (exam-directed)</h1>\n<p>Lane: ONEWORD/QBANK (agent-03) — notes are produced from the banks, so the same lane owns them Priority: 1 (Class 10 Science) Shelf: <strong>topper</strong> Blocked by: TASK-010 (the chapter Q-bank defines what the notes must cover) Owner approval needed: no Estimate: 2–3 agent sessions</p>\n<h2>Why this task</h2>\n<p>Topper Notes are what the parent is paying for and what the free shelf must never show. They are not \"shorter complete notes\" — they are what the examiner ticks: verbatim definitions, formulae, mark splits, model answers, and the traps that cost marks.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Chapter Q-bank</td><td><code>StudyHub/TN/10th/Science/QBank/10_Science_QBank_Ch01_A5.pdf</code> + <code>.json</code></td><td>from TASK-010</td></tr><tr><td>Gated PYQ</td><td><code>StudyHub/TN/10th/Science/PYQ/</code></td><td>from TASK-002 — use real exam phrasing for the \"if asked X, write Y\" patterns</td></tr><tr><td>Textbook unit 1</td><td>in hand</td><td>base source</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Open with a half-page \"what the examiner wants in this unit\" — mark distribution per topic, based on the gated PYQ frequency (count how often each topic appeared 2022–2026).</li>\n<li>Verbatim-writable definitions for every named concept/term in the unit.</li>\n<li>One formula box: formula, meaning of each symbol, SI unit, one worked example.</li>\n<li>Mark-splitting for at least 3 long answers, written as the teacher's tick sequence.</li>\n<li>Five model answers written full length, in exam-friendly language.</li>\n<li>A traps list: the 6–10 most common mistakes in this unit, each with its correction beside it.</li>\n<li>Layout per house style: A5, ruled/structured, brand line in the footer, page numbers, readable at phone zoom.</li>\n<li><strong>Folder note:</strong> the tree in <code>OFFICE.md</code> §5.10 has no <code>Notes/</code> folder yet. Create <code>StudyHub/TN/10th/Science/Notes/</code> for notes and say so in your log, so the Manager can update <code>OFFICE.md</code> §5.10 and <code>ledgers/drive_map.json</code>. Never file notes into <code>OneWord/</code>, <code>QBank/</code>, <code>SlowLearners/</code>, or <code>PYQ/</code>.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_TopperNotes_Unit01_A5.pdf</code></td><td><code>StudyHub/TN/10th/Science/Notes/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>One unit's Topper Notes on Drive, in a Notes folder, following the layout rules — and every factual claim checked against the textbook. <strong>One unit only.</strong></p>\n<h2>Checklist to run</h2>\n<p><code>training/quality-checklist.md</code> §0 + §3 (Topper Notes) in full.</p>\n<h2>Techniques</h2>\n<p>§5.7 (A5 working size, no stretching, fonts embedded, no tofu — Tamil/superscripts must render) · §5.6 (brand line in footer; full watermark only on the print copy) · §5.1 upload · §5.8 ledgers · §5.9 naming.</p>","path":"tasks/archive/2026-09-23-round1/TASK-013-topper-notes-science-unit1.md"},{"slug":"TASK-014-topper-notes-maths-ch1-3","id":"TASK-014","title":"10th Maths: Topper Notes, Chapters 1–3 (formulae + worked method)","lane":"ONEWORD/QBANK (agent-03)","priority":"2 (Class 10 Maths)","shelf":"**topper**","blocked_by":"TASK-004 (the gated Maths PYQ defines the exam pattern the notes must serve)","owner_approval":"no","estimate":"3 agent sessions","stop_condition":"Three chapters, every worked problem independently re-solved, on Drive in the Maths Notes folder, Tamil+English medium versions if the source supports both.","why":"Maths Topper Notes live or die on worked method , not prose. A student must be able to copy the exact step sequence and get full marks. This is also the safest high-value note type to check for correctness (the arithmetic either works or it does not).","html":"<h1>TASK-014 — 10th Maths: Topper Notes, Chapters 1–3 (formulae + worked method)</h1>\n<p>Lane: ONEWORD/QBANK (agent-03) Priority: 2 (Class 10 Maths) Shelf: <strong>topper</strong> Blocked by: TASK-004 (the gated Maths PYQ defines the exam pattern the notes must serve) Owner approval needed: no Estimate: 3 agent sessions</p>\n<h2>Why this task</h2>\n<p>Maths Topper Notes live or die on <strong>worked method</strong>, not prose. A student must be able to copy the exact step sequence and get full marks. This is also the safest high-value note type to check for correctness (the arithmetic either works or it does not).</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Gated Maths PYQ</td><td><code>StudyHub/TN/10th/Maths/PYQ/</code></td><td>from TASK-004</td></tr><tr><td>Textbook chapters 1–3</td><td>in hand</td><td>base source</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Per chapter: the formulae/method sheet (every formula used in the chapter, with the condition under which it applies).</li>\n<li>For each major problem type: the step template a student writes in the exam (\"Step 1: write the relation. Step 2: substitute. Step 3: simplify. Step 4: state the answer with unit.\").</li>\n<li>3 fully worked model problems per chapter with the mark split shown against each step.</li>\n<li>A traps list: sign errors, unit omissions, rounding, formula misapplication — each with a one-line fix.</li>\n<li>A \"what changes if the question is twisted\" box: the 2–3 common variants of each problem type.</li>\n<li>Output: <code>10_Maths_TopperNotes_Ch01-03_A5.pdf</code> → <code>StudyHub/TN/10th/Maths/Notes/</code>.</li>\n<li><strong>Verify every worked number.</strong> Re-solve each problem independently before publishing; a wrong step in Maths Topper Notes is a product-killing defect.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Maths_TopperNotes_Ch01-03_A5.pdf</code></td><td><code>StudyHub/TN/10th/Maths/Notes/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Three chapters, every worked problem independently re-solved, on Drive in the Maths Notes folder, Tamil+English medium versions if the source supports both.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §3 (Topper Notes). Add: each worked solution re-solved from scratch a second time.</p>\n<h2>Techniques</h2>\n<p>§5.7 (A5, embedded math font, superscripts/subscripts/√ render — no tofu) · §5.6 footer brand line · §5.1 upload pattern · §5.8 ledgers. Tamil medium version keeps the English technical term in brackets on first use (§ content-standards §3).</p>","path":"tasks/archive/2026-09-23-round1/TASK-014-topper-notes-maths-ch1-3.md"},{"slug":"TASK-015-lastminute-notes-science","id":"TASK-015","title":"10th Science: Last-Minute Notes, Units 1–3 (night-before card)","lane":"ONEWORD/QBANK (agent-03)","priority":"1 (Class 10 Science)","shelf":"**topper**","blocked_by":"TASK-013","owner_approval":"","estimate":"1–2 agent sessions","stop_condition":"Three units on Drive, each 1–2 A5 pages, nothing new introduced, legible on a phone without zooming.","why":"The night before the exam is when a student decides whether our app is worth opening. A 1–2 page card per unit, printable at A5, is the highest-perceived-value thing we can hand over — and it costs almost nothing once Complete/Topper notes exist, because it i…","html":"<h1>TASK-015 — 10th Science: Last-Minute Notes, Units 1–3 (night-before card)</h1>\n<p>Lane: ONEWORD/QBANK (agent-03) Priority: 1 (Class 10 Science) Shelf: <strong>topper</strong> Blocked by: TASK-013 Owner needed: no Estimate: 1–2 agent sessions</p>\n<h2>Why this task</h2>\n<p>The night before the exam is when a student decides whether our app is worth opening. A 1–2 page card per unit, printable at A5, is the highest-perceived-value thing we can hand over — and it costs almost nothing once Complete/Topper notes exist, because it is a <strong>compression, not new content</strong>.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Topper Notes Unit 1</td><td><code>StudyHub/TN/10th/Science/Notes/10_Science_TopperNotes_Unit01_A5.pdf</code></td><td>from TASK-013</td></tr><tr><td>Q-bank ch1</td><td><code>StudyHub/TN/10th/Science/QBank/</code></td><td>from TASK-010</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>For each unit (1–3): one A5 front page = formulae + one-line definitions + diagram-label lists + units; one A5 back page = \"if asked X, write Y\" patterns for the 5 most likely questions + top 10 traps.</li>\n<li>Bullets and boxes only — no paragraphs, no full sentences where a fragment works.</li>\n<li><strong>Introduce nothing new.</strong> Every line must already exist in the Complete/Topper notes for that unit. This is a compression.</li>\n<li>Print check: at A5 with no wasted margin, every line legible without zooming.</li>\n<li>Output: <code>10_Science_LastMinute_Unit01-03_A5.pdf</code> → <code>StudyHub/TN/10th/Science/Notes/</code>.</li>\n<li>Count check: every formula and definition in the card must be traceable to the source note (list the mapping in <code>log.md</code> — a one-line audit trail).</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_LastMinute_Unit01-03_A5.pdf</code> (1–2 A5 pages per unit)</td><td><code>StudyHub/TN/10th/Science/Notes/</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Three units on Drive, each 1–2 A5 pages, nothing new introduced, legible on a phone without zooming.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §4 (Last-Minute Notes) in full.</p>\n<h2>Techniques</h2>\n<p>§5.7 print/legibility rules · §5.6 footer brand line · §5.1 upload · §5.8 ledgers · naming per §5.9. Keep the source mapping in the log so the Manager can audit \"nothing new\".</p>","path":"tasks/archive/2026-09-23-round1/TASK-015-lastminute-notes-science.md"},{"slug":"TASK-016-slowlearner-science-unit1","id":"TASK-016","title":"10th Science: Slow-Learner pack, Unit 1 (in-house only, never republished)","lane":"ONEWORD/QBANK (agent-03)","priority":"1 (Class 10 Science)","shelf":"**topper** (never free, never student-facing as a third-party file)","blocked_by":"TASK-013","owner_approval":"no","estimate":"2 agent sessions","stop_condition":"One unit's slow-learner pack on Drive, in-house written, every diagram label double-checked.","why":"Slow-learner material is the product that keeps a weak student inside the app, and the debrief is explicit that this must be our own work, in our own words — Padasalai is full of other teachers' SLM and republishing it as ours is forbidden and legally unsafe.","html":"<h1>TASK-016 — 10th Science: Slow-Learner pack, Unit 1 (in-house only, never republished)</h1>\n<p>Lane: ONEWORD/QBANK (agent-03) Priority: 1 (Class 10 Science) Shelf: <strong>topper</strong> (never free, never student-facing as a third-party file) Blocked by: TASK-013 Owner approval needed: no Estimate: 2 agent sessions</p>\n<h2>Why this task</h2>\n<p>Slow-learner material is the product that keeps a weak student inside the app, and the debrief is explicit that this must be <strong>our own work, in our own words</strong> — Padasalai is full of other teachers' SLM and republishing it as ours is forbidden and legally unsafe.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Topper Notes Unit 1</td><td><code>StudyHub/TN/10th/Science/Notes/</code></td><td>from TASK-013</td></tr><tr><td>Textbook Unit 1</td><td>in hand</td><td>the only content source — same syllabus, different presentation</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Restructure Unit 1 into the slow-learner shape: one idea per page-panel, the textbook's language simplified, every technical term defined at first use, an example before the theory where possible.</li>\n<li>Add \"check yourself\" micro-questions after each panel (3 per unit) with answers directly below (this audience needs immediate feedback).</li>\n<li>Add a pronunciation/vocabulary panel for the Tamil-medium student: English technical term → Tamil meaning → one usage example.</li>\n<li>Diagrams: same labelled diagrams as the Topper notes, but larger, with label callouts drawn around the figure — <strong>labels verified twice against the textbook</strong> (the shipped wrong-label error class must not repeat).</li>\n<li>No paragraphs longer than 3 lines. No page more than 40% text.</li>\n<li>Output: <code>10_Science_SlowLearner_Unit01_A5.pdf</code> → <code>StudyHub/TN/10th/Science/SlowLearners/</code>.</li>\n<li>Write the source-provenance line into the log: \"all content written in-house from the TN textbook, no third-party SLM used\". This is a compliance record, not a formality.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_SlowLearner_Unit01_A5.pdf</code></td><td><code>StudyHub/TN/10th/Science/SlowLearners/</code></td></tr><tr><td>provenance line</td><td><code>agents/agent-03/log.md</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>One unit's slow-learner pack on Drive, in-house written, every diagram label double-checked.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §2 (Complete Notes — the closest checklist; a slow-learner pack is a Complete Note restructured for a weaker reader) + the factual-verification items in §5.</p>\n<h2>Techniques</h2>\n<p>§5.7 (A5, embedded fonts, no tofu, legible) · §5.6 footer brand · §5.1 upload · §5.8 ledgers · <strong>legal rule: never republish a third party's SLM</strong> (<code>content-standards.md</code> §1).</p>","path":"tasks/archive/2026-09-23-round1/TASK-016-slowlearner-science-unit1.md"},{"slug":"TASK-017-create-model-paper-science","id":"TASK-017","title":"Create a new 10th Science model paper + answer key (board pattern)","lane":"MODEL (agent-02)","priority":"1 (Class 10 Science)","shelf":"free","blocked_by":"TASK-008 (recovery inventory first — never create what may already exist)","owner_approval":"no","estimate":"2 agent sessions","stop_condition":"One model paper + key on Drive, total marks = 100, pattern matching the gated board papers, no endorsement claim. **One model paper, not a series.**","why":"With TASK-008 complete, the gaps are known. A model paper built from our own gated PYQ frequency distribution is defensible, improvable, and ours — and the free shelf (PYQ + models + model keys) is the acquisition funnel for the paid shelf.","html":"<h1>TASK-017 — Create a new 10th Science model paper + answer key (board pattern)</h1>\n<p>Lane: MODEL (agent-02) Priority: 1 (Class 10 Science) Shelf: free Blocked by: TASK-008 (recovery inventory first — never create what may already exist) Owner approval needed: no Estimate: 2 agent sessions</p>\n<h2>Why this task</h2>\n<p>With TASK-008 complete, the gaps are known. A model paper built from our own gated PYQ frequency distribution is defensible, improvable, and ours — and the free shelf (PYQ + models + model keys) is the acquisition funnel for the paid shelf.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Recovery inventory</td><td><code>agents/agent-02/log.md</code></td><td>from TASK-008 — check what already exists</td></tr><tr><td>Gated Science PYQ 2022–2026</td><td><code>StudyHub/TN/10th/Science/PYQ/</code></td><td>from TASK-002 — basis for topic weighting</td></tr><tr><td>Chapter Q-bank ch1</td><td><code>StudyHub/TN/10th/Science/QBank/</code></td><td>from TASK-010 — reusable questions</td></tr><tr><td>Board paper pattern</td><td>the gated PYQ headers</td><td>marks split, duration, instructions</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Build the blueprint first: number of questions per mark band per unit, weighted by how often each unit appeared in the gated 2022–2026 papers. Write the blueprint into <code>log.md</code> — this is the evidence that the paper is board-shaped, not invented.</li>\n<li>Compose the paper: exact board pattern (sections, marks, duration, instructions verbatim in structure), header with class/subject/medium/marks/time/paper code and the brand line.</li>\n<li>No claim of official board endorsement anywhere on the page.</li>\n<li>Write the separate answer key with marking points in tick order, diagram marks noted, and the blueprint's mark split honoured.</li>\n<li>Output: <code>10_Science_Model_01_Both.pdf</code> and <code>10_Science_Model_01_Both_KEY.pdf</code> → <code>StudyHub/TN/10th/Science/Models/</code>.</li>\n<li>Independent check: hand the key to a second pass (yourself, re-solving) — every answer verified, every mark total adding to 100.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td><code>10_Science_Model_01_Both.pdf</code></td><td><code>StudyHub/TN/10th/Science/Models/</code></td></tr><tr><td><code>10_Science_Model_01_Both_KEY.pdf</code></td><td><code>StudyHub/TN/10th/Science/Models/</code></td></tr><tr><td>blueprint (mark distribution evidence)</td><td><code>agents/agent-02/log.md</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>One model paper + key on Drive, total marks = 100, pattern matching the gated board papers, no endorsement claim. <strong>One model paper, not a series.</strong></p>\n<h2>Checklist to run</h2>\n<p>§0 + §5 (paper) in full.</p>\n<h2>Techniques</h2>\n<p>§5.7 layout/print rules (A5 working size for the print copy later; the app copy is the A4 original) · §5.6 brand line · §5.1 upload · §5.8 ledgers · §5.9 naming. Questions reused from the Q-bank keep their <code>source</code> fields in any JSON export.</p>","path":"tasks/archive/2026-09-23-round1/TASK-017-create-model-paper-science.md"},{"slug":"TASK-018-quarantine-audit-vault","id":"TASK-018","title":"Quarantine audit: the ~185 \"unique Science\" set + the 4 contaminated Quarterly files","lane":"QA/CENTUM (agent-05)","priority":"1 (unblocks trust in everything else)","shelf":"n/a (audit)","blocked_by":"TASK-001","owner_approval":"yes — the owner receives the decision list (nothing is deleted, ever)","estimate":"2–4 sessions (batched; the set is large)","stop_condition":"The report states, in one number, how many **genuinely usable** Science originals the office owns, and lists the mislabelled ones with their real subject. Nothing moved, nothing deleted.","why":"The debrief estimates ~185 \"unique Science originals\" of unknown subject, plus a known-bad set of four files named Science in Question Papers/10th/Quarterly/2026/STATE/ . Until these are classified, nobody knows what the office actually owns — and \"185 files\"…","html":"<h1>TASK-018 — Quarantine audit: the ~185 \"unique Science\" set + the 4 contaminated Quarterly files</h1>\n<p>Lane: QA/CENTUM (agent-05) Priority: 1 (unblocks trust in everything else) Shelf: n/a (audit) Blocked by: TASK-001 Owner approval needed: yes — the owner receives the decision list (nothing is deleted, ever) Estimate: 2–4 sessions (batched; the set is large)</p>\n<h2>Why this task</h2>\n<p>The debrief estimates ~185 \"unique Science originals\" of unknown subject, plus a known-bad set of four files named Science in <code>Question Papers/10th/Quarterly/2026/STATE/</code>. Until these are classified, nobody knows what the office actually owns — and \"185 files\" keeps being mistaken for progress.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Suspect originals</td><td><code>Question Papers/{6,7,8,9,10}th/Quarterly/2025/&lt;District&gt;/</code> and the 10th Quarterly 2026 STATE folder</td><td>listing-harvest, untrusted</td></tr><tr><td>Gate tool</td><td><code>tools/page1_gate.py</code></td><td>from TASK-001</td></tr><tr><td>Known truth</td><td>SSLC Science Annual STATE files are trusted</td><td>do not re-audit them</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Batch the work: one class/exam folder per session. <code>list</code> the folder, download in small batches (≤20 files), gate each, record a row.</li>\n<li>Classify every file: <strong>PASS</strong> (subject matches name) · <strong>WRONG-SUBJECT</strong> (name says Science, page 1 says Tamil/Maths/Social/English) · <strong>UNREADABLE</strong> (no text layer, OCR fails, blank scan) · <strong>DIRTY</strong> (foreign branding, phone number, student ticks) · <strong>DUPLICATE</strong> (md5 already seen).</li>\n<li>Do <strong>not</strong> move anything yet. Produce a classification table only. Moves to <code>_QUARANTINE/</code> happen as copies, after the owner sees the list.</li>\n<li>Aggregate: true counts per subject per class, duplicates removed, dirty rejected. This number — not \"185\" — becomes the office's stated inventory.</li>\n<li>Write <code>ledgers/gate_results.csv</code> rows for every file and a summary table <code>reports/audits/vault-audit-YYYY-MM-DD.md</code> with: files examined, PASS by subject, WRONG-SUBJECT breakdown, DIRTY, duplicates, and a <strong>reclaimed list</strong> (mislabelled files that are actually useful material for their real subject).</li>\n<li>Escalate to the owner: any folder where the mismatch rate is above ~20% (that indicates the whole folder was harvested from a listing and should not be trusted at all).</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Where</th></tr></thead><tbody><tr><td>classification rows (all files)</td><td><code>ledgers/gate_results.csv</code></td></tr><tr><td>audit report with counts + examples + Drive links</td><td><code>reports/audits/vault-audit-YYYY-MM-DD.md</code></td></tr><tr><td>duplicate rows</td><td><code>ledgers/duplicates.csv</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>The report states, in one number, how many <strong>genuinely usable</strong> Science originals the office owns, and lists the mislabelled ones with their real subject. Nothing moved, nothing deleted.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §8 (recovery/continuation).</p>\n<h2>Techniques</h2>\n<p>§5.2 gate (text-first, OCR fallback) · §5.3 md5 · §5.10 quarantine-as-copy · §5.4 dirty rejection (<strong>never crop a dirty file</strong>) · batched downloads to stay under session limits · one path at a time, never <code>tree</code>.</p>","path":"tasks/archive/2026-09-23-round1/TASK-018-quarantine-audit-vault.md"},{"slug":"TASK-019-class9-science-gated-set","id":"TASK-019","title":"Class 9 Science: gate what exists, publish the real set","lane":"PYQ (agent-01)","priority":"6 (Class 9 — after 10 is clean)","shelf":"free","blocked_by":"TASK-002, TASK-018 (learn the mismatch rate first — Class 9 district sets are the same harvest lineage)","owner_approval":"no","estimate":"2–3 agent sessions","stop_condition":"Class 9 Science contains only page-1-verified files, and the log states the true count with the reclaim/reject breakdown.","why":"Class 9 claimed 26 unique Quarterly 2025 district papers and 2022 Science papers. Some of that is real content. It is also the class whose files came from the same listing harvest that produced the mislabels, so it must be treated as contaminated until gated…","html":"<h1>TASK-019 — Class 9 Science: gate what exists, publish the real set</h1>\n<p>Lane: PYQ (agent-01) Priority: 6 (Class 9 — after 10 is clean) Shelf: free Blocked by: TASK-002, TASK-018 (learn the mismatch rate first — Class 9 district sets are the same harvest lineage) Owner approval needed: no Estimate: 2–3 agent sessions</p>\n<h2>Why this task</h2>\n<p>Class 9 claimed 26 unique Quarterly 2025 district papers and 2022 Science papers. Some of that is real content. It is also the class whose files came from the same listing harvest that produced the mislabels, so it must be treated as contaminated until gated — <strong>but the reclaimed files are free library material and worth the audit.</strong></p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>9th Science 2022 Annual (TM+EM)</td><td><code>Question Papers/9th/Annual/2022/STATE/</code></td><td>medium trust, not re-gated</td></tr><tr><td>9th Quarterly 2025 districts</td><td><code>Question Papers/9th/Quarterly/2025/&lt;District&gt;/</code> (≈26 claimed unique)</td><td>low trust</td></tr><tr><td>Gate results so far</td><td><code>ledgers/gate_results.csv</code></td><td>from TASK-018</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>Reuse TASK-018's classification for Class 9 — do not re-gate what is already classified.</li>\n<li>Publish only PASS files, as copies, into <code>StudyHub/TN/9th/Science/PYQ/{Annual|Quarterly}/&lt;year&gt;/</code>.</li>\n<li>District stays in the filename/ledger — never a folder inside StudyHub.</li>\n<li>Deduplicate across districts first: the same district paper appears under multiple names.</li>\n<li>Report the real count: \"Class 9 Science: X gated papers (Y reclaimed from mislabels, Z rejected)\". The number matters because the old claim was 26.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Drive path</th></tr></thead><tbody><tr><td>gated <code>9_Science_&lt;Exam&gt;_&lt;year&gt;_&lt;source&gt;.pdf</code> set</td><td><code>StudyHub/TN/9th/Science/PYQ/&lt;Exam&gt;/&lt;year&gt;/</code></td></tr><tr><td>real-count report line</td><td><code>agents/agent-01/log.md</code></td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>Class 9 Science contains only page-1-verified files, and the log states the true count with the reclaim/reject breakdown.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §6 + §8 (the reclaims are recovery work).</p>\n<h2>Techniques</h2>\n<p>§5.2 gate · §5.3 md5 dedupe · §5.10 quarantine · §5.1 upload pattern · <strong>do not start Class 8 or Class 12</strong> — Class 8's watermark job (TASK-012) and the 11/12 park both stand in the way.</p>","path":"tasks/archive/2026-09-23-round1/TASK-019-class9-science-gated-set.md"},{"slug":"TASK-020-drive-map-and-ready-manifest","id":"TASK-020","title":"Drive map + READY manifest for the Qwen (website) lane","lane":"QA/CENTUM (agent-05)","priority":"1 (this is the handover that makes published files visible in the app)","shelf":"free + topper (manifest lists both, tagged)","blocked_by":"TASK-002 (needs at least one published set to manifest)","owner_approval":"no","estimate":"1 agent session, then a 10-minute refresh after each publish task","stop_condition":"The manifest lists exactly the files that exist on Drive right now, with the correct shelf tags, and the drive map has a verified id for every StudyHub path.","why":"The team's published files never reached the app because the harvest agents were forbidden to touch catalogue.json and nobody owned the handover. The fix is not to edit catalogue.json — it is to produce a manifest that the Qwen lane consumes. This task also r…","html":"<h1>TASK-020 — Drive map + READY manifest for the Qwen (website) lane</h1>\n<p>Lane: QA/CENTUM (agent-05) Priority: 1 (this is the handover that makes published files visible in the app) Shelf: free + topper (manifest lists both, tagged) Blocked by: TASK-002 (needs at least one published set to manifest) Owner approval needed: no Estimate: 1 agent session, then a 10-minute refresh after each publish task</p>\n<h2>Why this task</h2>\n<p>The team's published files never reached the app because the harvest agents were forbidden to touch <code>catalogue.json</code> and nobody owned the handover. The fix is not to edit <code>catalogue.json</code> — it is to produce a <strong>manifest</strong> that the Qwen lane consumes. This task also rebuilds the drive map whose absence caused every agent to re-discover folder ids.</p>\n<h2>Inputs</h2>\n<div class=\"tw\"><table><thead><tr><th>What</th><th>Where</th><th>State</th></tr></thead><tbody><tr><td>Known folder ids</td><td><code>ledgers/drive_map.json</code> (4 ids, 22–23 Sep)</td><td>stale, must be re-verified</td></tr><tr><td>Published files</td><td><code>ledgers/publish_log.csv</code></td><td>grows with every publish task</td></tr><tr><td>Shelf rules</td><td><code>OFFICE.md</code> §6</td><td>free vs topper</td></tr></tbody></table></div>\n<h2>Steps</h2>\n<ol>\n<li>For every path in <code>OFFICE.md</code> §5.10, <code>list_folders</code> the parent and record the folder id in <code>ledgers/drive_map.json</code> (create missing folders only if a task requires them — <strong>this task creates nothing</strong>).</li>\n<li>Verify each known id by listing it and confirming the name matches. Replace stale ids.</li>\n<li>Build <code>reports/READY_MANIFEST.md</code>: one row per published file — <code>class | subject | exam | year | medium | shelf | file name | Drive path | size | verified gate row | date</code>.</li>\n<li>Validate the manifest against Drive: every row's file must exist at that path (a 30-second <code>list</code> check). Remove or comment any row that does not exist.</li>\n<li>Tag the shelf column strictly: <code>free</code> = PYQ, Models, model keys. <code>topper</code> = OneWord, QBank, Notes, SlowLearners. <strong>A Topper file in the free list is a product-breaking error.</strong></li>\n<li>Note the Qwen handover rule at the top of the manifest: <em>the website lane reads this file; no agent in this office edits <code>catalogue.json</code>.</em></li>\n<li>Refresh cadence: re-run steps 3–5 after every publish task, and log the refresh line.</li>\n</ol>\n<h2>Deliverables</h2>\n<div class=\"tw\"><table><thead><tr><th>File</th><th>Where</th></tr></thead><tbody><tr><td><code>ledgers/drive_map.json</code> (verified ids, complete StudyHub tree)</td><td>repo</td></tr><tr><td><code>reports/READY_MANIFEST.md</code></td><td>repo — this is what the Qwen lane and the Manager both read</td></tr></tbody></table></div>\n<h2>Stop condition</h2>\n<p>The manifest lists exactly the files that exist on Drive right now, with the correct shelf tags, and the drive map has a verified id for every StudyHub path.</p>\n<h2>Checklist to run</h2>\n<p>§0 + §6 (naming/structure) + the shelf-tag check above.</p>\n<h2>Techniques</h2>\n<p>§5.1 <code>list_folders</code>/<code>list</code> one path at a time (never <code>tree</code>), ≥180 s timeouts · §5.10 tree shape · §5.8 ledgers in repo. <strong>Never edit <code>catalogue.json</code>.</strong></p>","path":"tasks/archive/2026-09-23-round1/TASK-020-drive-map-and-ready-manifest.md"}]}],"slots":[{"id":"agent-01","number":"01","status":"STAGED","status_label":"Staged","status_color":"#5b8def","role":"PYQ — gated public question papers, year by year","task_id":"TASK-002","task_name":"TASK-002 — Publish gated SSLC Science 2022–2026 into StudyHub (queued)","task_slug":"","progress_percent":0,"files_produced":0,"blocker":null,"is_at_risk":false,"next_step":"on GO — verify page 1 of the 5 SSLC Science STATE files, then copy them into StudyHub/TN/10th/Science/PYQ/Annual/<year>/","stop_condition":"5 files in StudyHub/TN/10th/Science/PYQ/Annual/, each opening on page 1 as Science (அறிவியல்), links pasted in log.md","last_log_time":"2026-09-23T13:35Z","last_log_age_
