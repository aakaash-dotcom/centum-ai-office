e subject of every file it examined</p>\n<hr>\n<h2>Your lane in one line</h2>\n<p>You are the reason the next four days are not wasted. <strong>The office's single biggest gap is the page-1 subject gate</strong> — the missing tool that let Tamil papers be filed as Science for two days. Build it, then be the independent verifier of every other lane's output.</p>\n<h2>TASK-001 specifics</h2>\n<ul>\n<li>Input: a PDF, a folder, or a local path. Output: subject verdict per page 1.</li>\n<li>Read the text layer first; OCR when there is no text layer; recognise Tamil tokens — அறிவியல் Science · கணிதம் Maths · தமிழ் Tamil · ஆங்கிலம் English · சமூக அறிவியல் Social Science · வினாத்தாள் question paper.</li>\n<li>Handle the known trap: an all-subject bundle's page 1 may show a subject table, and a Tamil <em>paper</em> may sit behind an English <em>title</em>. Look at the subject heading inside the paper, plus the section markers (Part I/II/III, marks scheme).</li>\n<li>Verdicts: <strong>PASS</strong> (matches the name), <strong>REVIEW</strong> (ambiguous — human decides, never auto-publish), <strong>FAIL</strong> (wrong subject → quarantine).</li>\n<li>Append to <code>ledgers/gate_results.csv</code> as it goes. Never rewrite old rows.</li>\n<li>It must be rerunnable and idempotent — the same file gated twice yields the same row, not a duplicate.</li>\n</ul>\n<h2>Your other jobs</h2>\n<ul>\n<li>Verify every lane's uploads by <code>list</code>ing Drive, not by reading their summaries.</li>\n<li>First audit after the gate: the ~185 \"unique Science originals\" and the 10th Quarterly 2026 STATE files (four files named Science — known contaminated).</li>\n<li>Quarantine report: what failed, why, and the Drive link, so the owner can decide.</li>\n<li>Later: stand up the Centum test side — the JSON from agent-03 loading into the player and scoring correctly, and the first recording opening. <strong>No Centum checkout until both work.</strong></li>\n</ul>\n<h2>Rules</h2>\n<p>Judge file  Office (2026-09-23T14:04Z)</h3>\n<p>Built the phone control room you asked for: <strong><code>app/</code></strong> — a read-only app that renders the whole office (agents, tasks, reports, and the actions waiting on you) from <code>app/data/office.json</code>, compiled from <code>board.json</code> + the agent logs + the task files + the reports.</p>\n<div class=\"tw\"><table><thead><tr><th>Piece</th><th>What it does for you</th></tr></thead><tbody><tr><td><strong>Office screen</strong></td><td>Health, the freeze strip, all 5 agents at a glance, \"N things need you\"</td></tr><tr><td><strong>Agent screens</strong></td><td>Lane, status, task, progress, blocker, stop condition, full log, and a <strong>Copy start prompt</strong> button per slot</td></tr><tr><td><strong>Tasks screen</strong></td><td>Queue / Active / Review / Done with lane filters and search; every task file readable in full</td></tr><tr><td><strong>Reports screen</strong></td><td>Daily reports with owner actions at the top, each with a <strong>Copy prompt</strong> button</td></tr><tr><td><strong>Files screen</strong></td><td>The READY MANIFEST — what is published to StudyHub and what needs a decision</td></tr><tr><td><strong>Help screen</strong></td><td>Your 30-second routine, the manager prompt to copy, home-screen install steps</td></tr><tr><td>Single-file build</td><td><code>app/index.standalone.html</code> — 285 KB, everything inlined, works offline anywhere</td></tr><tr><td>PWA</td><td>installable on the home screen with the gold-C icon; offline shell; ⟳ refreshes the data</td></tr><tr><td>Safety</td><td><strong>No credentials anywhere in the app</strong> (it is published publicly), and it cannot write to Drive</td></tr><tr><td>Checks</td><td><code>node tools/smoke_test_app.js</code> — 18 automated checks rendering every screen; all pass</td></tr></tbody></table></div>\n<h3>What was built this run</h3>\n<div class=\"tw\"><table><thead><tr><th>Built</th><th>Purpose</th></tr></thead><tbody><tr><td><c t-04 (gen 1)</td><td>STAGED — off duty</td><td>no task: planning phase (was TASK-011 Rebuild the 2-up print pipeline</td><td>0%</td><td>2026-09-23T13:35Z</td></tr><tr><td>agent-05 (gen 1)</td><td>STAGED — off duty</td><td>no task: planning phase (was TASK-001 Build the page-1 subject gate</td><td>0%</td><td>2026-09-23T13:35Z</td></tr></tbody></table></div>\n<h2>QUEUE STATUS</h2>\n<p>Waiting: <strong>0 tasks</strong> (planning phase — round-1 list archived)</p>\n<p>Next up (draft round 2, awaiting your GO — detail in <code>PLAN.md</code>):</p>\n<ol>\n<li><strong>QA</strong> builds the page-1 subject gate (the tool the whole office waits on) — safe during the freeze</li>\n<li><strong>PYQ</strong> publishes the five gated Science papers into <code>StudyHub/TN/10th/Science/PYQ/Annual/&lt;year&gt;/</code></li>\n<li><strong>QA</strong> returns a one-number verdict on the old vault's \"Science\" set</li>\n<li><strong>Manager</strong> updates the READY MANIFEST and rebuilds the app</li>\n</ol>\n<h2>BLOCKERS</h2>\n<div class=\"tw\"><table><thead><tr><th>Blocker</th><th>Owner?</th><th>What is needed</th></tr></thead><tbody><tr><td><strong>Freeze in force</strong> — no files can be published, so no student sees anything new</td><td><strong>YES</strong></td><td>GO / NO-GO on the role table in <code>OFFICE.md</code> §3</td></tr><tr><td>Class 8 watermark inconsistency: files 1–98 carry the pre-2026-09-16 wrong angle, 99–444 not done</td><td>no (owner must release the freeze for it)</td><td>scheduled as TASK-012</td></tr><tr><td>The 16 MB diagram PDF is above the bridge's 8 MB ceiling and is not scientifically correct</td><td><strong>YES</strong></td><td>decide: fix, regenerate, or hide (it is currently listed nowhere student-facing)</td></tr><tr><td>~185 \"unique Science\" files unverified; 4 files named Science in 10th Quarterly 2026 STATE are known contaminated</td><td>no</td><td>scheduled as TASK-018 — needs the gate first</td></tr></tbody></table></div>\n<h2>TECHNIQUES STATUS</h2>\n<p>Nothing broke this run — no technique was exercised. Carried-forward status, now documented in <code>OFFICE.md</code> §5 and <code>tools/README.md</code>:</p>\n<div class=\"tw\"><table><thead><tr><th>Technique</th><th>Status</th></tr></thead><tbody><tr><td>Drive Apps Script bridge (<code>bridge.py</code> / <code>drive_upload.py</code>)</td><td>WORKS — mandatory <code>text/plain</code>, ≥180 s, ≤8 MB, replace-verify, 4 workers</td></tr><tr><td>Own watermark (<code>wm_apply.py</code>)</td><td>WORKS — BL→TR, 0.17, vector; direction broken before 2026-09-16</td></tr><tr><td>Third-party strip (<code>wmclean.py</code>)</td><td>layer 1 (vector) WORKS, layer 2 (raster inpaint) risky</td></tr><tr><td>Page-1 subject gate</td><td><strong>DOES NOT EXIST — this is the gap everything waits on (TASK-001)</strong></td></tr><tr><td>2-up pipeline (<code>qp_2up.py</code>)</td><td>BROKEN — depends on a wiped <code>papers/manifest.json</code> (TASK-011)</td></tr><tr><td><code>qc_scan.py</code></td><td>screening only — not OCR, not Tamil, not a subject gate</td></tr><tr><td>Virtual Office app (<code>app/</code>)</td><td>WORKS — pixel office, 30 automated checks passing, read-only, rebuilt by the Manager each run and by a GitHub Action on push</td></tr><tr><td>GitHub Pages for the app</td><td><strong>NOT ENABLED</strong> — needs one owner setting (action 1)</td></tr><tr><td>Agent replacement (<code>tools/handover.py</code>)</td><td>BUILT — writes the handover, roster row and successor; tested with <code>--dry-run</code>, not yet used on a live station</td></tr></tbody></table></div>\n<h2>READY MANIFEST (for the website lane)</h2>\n<p>Nothing published by this office yet. One inherited file is listed with a warning: <code>10th_Science_Quarterly_Diagrams_RavisTuition.pdf</code> → <code>StudyHub/TN/10th/Science/Diagrams/</code> — no gate row, ~16 MB, one wrong diagram label. <strong>Do not put it on a free chip yet.</strong> Full detail in <code>reports/READY_MANIFEST.md</code>.</p TASK-011 staged |\n| agent-05 QA/CENTUM | none existed | slot created, role assigned, TASK-001 (gate tool) staged |\n\nThe previous team ran in five separate Arena chats with no shared board. There was nothing to audit — those chats cannot be read from here, so **their status is unknown, not idle.** Only what the debrief recorded has been carried forward, and it is marked by trust level in `board.json` and `ledgers/`.\n\n### Tasks Approved\nNone (no work in review).\n\n### Tasks Assigned\nNone activated — freeze. All 5 slots are **STAGED**: role + first task chosen, waiting on GO.\nStaged: agent-05 → TASK-001 · agent-01 → TASK-002 · agent-02 → TASK-008 · agent-03 → TASK-009 · agent-04 → TASK-011.\n\n### Tasks Rejected with Rework\nNone.\n\n### Run 3 — the pixel office, stations and the planning phase (this run)\n\n| Built | What it does |\n|---|---|\n| **Pixel office (top view)** | `app/office.js`: a game-style floor drawn pixel by pixel — Harvest room with 5 desks, lobby with the manager desk and the power panel, a corridor of locked rooms. Zoom-proof pixel rendering, 110 ms animation, tap any desk or door. |\n| **Lights follow reality** | LIGHTS ON (something logged/ran recently) · LIGHTS DIM (recent, nothing now) · **LIGHTS OFF / OFFICE CLOSED** (nothing for 90 min = your laptop-off state, whole floor dark, everyone asleep) |\n| **Sleeping agents** | Working agents type with the monitor on; silent ones sleep with a **red Zzz** (replace it) or a **grey Zzz** (off duty, never started); blocked ones stand with a red `!`; review ones hold a paper with a `?`; the run's top producer gets a gold `*` |\n| **Stations, not people** | Each desk has a station (agent-01…05), an occupant with a **generation**, a roster and a handover file. A stopped agent is **replaced**, never deleted: `tools/handover.py` writes the handover (log tail, progress, resume point, warnings), bumps the generation, and stages the successor who continues from the same point |\n| **Departments as room d, works offline anywhere |\n| PWA | installable on the home screen with the gold-C icon; offline shell; ⟳ refreshes the data |\n| Safety | **No credentials anywhere in the app** (it is published publicly), and it cannot write to Drive |\n| Checks | `node tools/smoke_test_app.js` — 18 automated checks rendering every screen; all pass |\n\n### What was built this run\n| Built | Purpose |\n|---|---|\n| `OFFICE.md` — master rules, the **one** role table, all proven techniques, \"done\" definition, Ravi's 12 standing rules | kills the three conflicting org charts |\n| `board.json` — real starting state, freeze state, 20 queued tasks, 5 staged slots | single source of truth |\n| `MANAGER-GUIDE.md` — the Manager's 6-phase runbook + the 10 failure patterns to watch | how this office is run every time |\n| `training/content-standards.md` + `training/quality-checklist.md` (8 checklists) | what good looks like, and the exact review criteria |\n| `training/roles/content-writer.md` + `manager.md` + `role-prompt-template.md` | agent onboarding that survives session loss |\n| `tasks/queue/` — **20 self-contained task files** | 5 agents busy for 2+ weeks |\n| `tools/README.md` + `ledgers/` (gate results, publish log, duplicates, drive map, watermark state) | the knowledge and proof that used to be lost every session |\n| `reports/READY_MANIFEST.md` | the handover to the website lane that never existed before |\n\n## CURRENT OFFICE STATE\n| Slot | Status | Task | Progress | Last Activity |\n|---|---|---|---|---|\n| agent-01 (gen 1) | STAGED — off duty | no task: planning phase | 0% | 2026-09-23T13:35Z |\n| agent-02 (gen 1) | STAGED — off duty | no task: planning phase (was TASK-008 Recover 10th model papers + keys | 0% | 2026-09-23T13:35Z |\n| agent-03 (gen 1) | STAGED — off duty | no task: planning phase (was TASK-009 One-word bank Science Ch1–3 + MCQ JSON | 0% | 2026-09-23T13:35Z |\n| agent-04 (gen 1) | STAGED — off duty | no task: planning phase (was TASK-011 Rebuild the 2-up print pipeline | 0% | 2026-09-23T13:35Z |\n| agent-05 (gen 1) | STAGED — off duty | no task: planning phase (was TASK-001 Build the page-1 subject gate | 0% | 2026-09-23T13:35Z |\n\n## QUEUE STATUS\nWaiting: **0 tasks** (planning phase — round-1 list archived)\n\nNext up (draft round 2, awaiting your GO — detail in `PLAN.md`):\n1. **QA** builds the page-1 subject gate (the tool the whole office waits on) — safe during the freeze\n2. **PYQ** publishes the five gated Science papers into `StudyHub/TN/10th/Science/PYQ/Annual/<year>/`\n3. **QA** returns a one-number verdict on the old vault's \"Science\" set\n4. **Manager** updates the READY MANIFEST and rebuilds the app\n\n## BLOCKERS\n| Blocker | Owner? | What is needed |\n|---|---|---|\n| **Freeze in force** — no files can be published, so no student sees anything new | **YES** | GO / NO-GO on the role table in `OFFICE.md` §3 |\n| Class 8 watermark inconsistency: files 1–98 carry the pre-2026-09-16 wrong angle, 99–444 not done | no (owner must release the freeze for it) | scheduled as TASK-012 |\n| The 16 MB diagram PDF is above the bridge's 8 MB ceiling and is not scientifically correct | **YES** | decide: fix, regenerate, or hide (it is currently listed nowhere student-facing) |\n| ~185 \"unique Science\" files unverified; 4 files named Science in 10th Quarterly 2026 STATE are known contaminated | no | scheduled as TASK-018 — needs the gate first |\n\n## TECHNIQUES STATUS\nNothing broke this run — no technique was exercised. Carried-forward status, now documented in `OFFICE.md` §5 and `tools/README.md`:\n\n| Technique | Status |\n|---|---|\n| Drive Apps Script bridge (`bridge.py` / `drive_upload.py`) | WORKS — mandatory `text/plain`, ≥180 s, ≤8 MB, replace-verify, 4 workers |\n| Own watermark (`wm_apply.py`) | WORKS — BL→TR, 0.17, vector; direction broken before 2026-09-16 |\n| Third-party strip (`wmclean.py`) | layer 1 (vector) WORKS, layer 2 (raster inpaint) risky |\n| Page-1 subject gate | **DOES NOT EXIST — this i LTS.md.\n\nSTOP CONDITION: it runs over a folder in one command, says PASS on the five SSLC Science STATE\nsplits, and FAIL on the files named Science that open as Tamil. Then stop.\n\nNo Drive writes (the freeze is on). No Drive deletes. Never paste the Drive secret anywhere.\nLog every step in agents/agent-05/log.md in the format in OFFICE.md section 7, then set\nSTATUS: REVIEW in agents/agent-05/current.md.\n"]},{"number":"5","title":"Two leftover decisions (one line each)","html":"<ol>\n<li><strong>The diagram PDF</strong> (16 MB, one wrong label): (a) regenerate with a science check, (b) hide it, (c) leave it.</li>\n<li><strong>The class-8 watermark run</strong> (98 of 444 done): (a) finish after round 2, (b) finish first, (c) leave it.</li>\n</ol>","prompts":[]}],"manifest":[{"head":["Class","Subject","Exam","Year","Medium","Shelf","File","Drive path","Size","Gate row","Date"],"rows":[["10","Science","Quarterly","—","Both","free","`10th_Science_Quarterly_Diagrams_RavisTuition.pdf`","`StudyHub/TN/10th/Science/Diagrams/`","~16 MB","**none**","2026-09-22"]]},{"head":["File","Issue","Action needed"],"rows":[["`10th_Science_Quarterly_Diagrams_RavisTuition.pdf`","inherited from the previous team: draw-and-label mixed on one page, one DNA base-pair label is wrong, and it is ~16 MB (above the 8 MB bridge ceiling)","Do not list on the free shelf until corrected or regenerated with a science check. Owner decision: fix, regenerate, or hide."]]},{"head":["Class","Subject","Exam","Year","Medium","Shelf","File","Drive path","Size","Gate row","Date"],"rows":[]}]};
/* CENTUM AI Office — pixel office engine (top view)
   Draws the office floor as low-res pixel art: rooms, desks, monitors, lights.
   - lights ON when something is alive (power LIVE/QUIET), OFF when the office is closed
   - a working agent types at the desk; a silent agent sleeps (Zzz) so you can see who to restart
   - a stopped agent sleeps in red and its desk offers a replacement (handover)
   - locked departments are dark rooms with padlocked doors
   Everything is drawn from app/data/office.json. No images, no assets, no writes. */
(function () {
  "use strict";

  var W = 240, H = 160;          // logical pixels (canvas internal resolution)
  var STEP = 110;                // frame step in ms (pixel-art cadence)
  var FONT = {
    "A": "010/101/111/101/101", "B": "110/101/110/101/110", "C": "011/100/100/100/011",
    "D": "110/101/101/101/110", "E": "111/100/110/100/111", "F": "111/100/110/100/100",
    "G": "011/100/101/101/011", "H": "101/101/111/101/101", "I": "111/010/010/010/111",
    "J": "001/001/001/101/010", "K": "101/101/110/101/101", "L": "100/100/100/100/111",
    "M": "101/111/111/101/101", "N": "101/111/111/111/101", "O": "010/101/101/101/010",
    "P": "110/101/110/100/100", "Q": "010/101/101/111/011", "R": "110/101/110/101/101",
    "S": "011/100/010/001/110", "T": "111/010/010/010/010", "U": "101/101/101/101/011",
    "V": "101/101/101/101/010", "W": "101/101/111/111/101", "X": "101/101/010/101/101",
    "Y": "101/101/010/010/010", "Z": "111/001/010/100/111",
    "0": "111/101/101/101/111", "1": "010/110/010/010/111", "2": "110/001/010/100/111",
    "3": "110/001/010/001/110", "4": "101/101/111/001/001", "5": "111/100/110/001/110",
    "6": "011/100/110/101/010", "7": "111/001/010/010/010", "8": "010/101/010/101/010",
    "9": "010/101/011/001/110",
    "-": "000/000/111/000/000", ".": "000/000/000/000/010", ":": "000/010/000/010/000",
    "!": "010/010/010/000/010", "?": "110/001/010/000/010", "/": "001/001/010/100/100",
    "%": "101/001/010/100/101", " ": "000/000/000/000/000", "+": "000/010/111/010/000",
    "*": "101/010/111/010/101", "(": "010/100/100/100/010", ")": "010/001/001/001/010"
  };

  var C = {
    floorA: "#2b3a4d", floorB: "#263447", wall: "#17212e", wallEdge: "#121a25",
    desk: "#8a6a43", deskTop: "#a2804f", deskEdge: "#6d5233",
    chair: "#3a4a60", metal: "#5d6b7c",
    screenOn: "#2fd07a", screenDim: "#1d4a52", screenOff: "#141b24",
    skin: ["#f0c396", "#c98a5b", "#8d5a34", "#5f3a20"],
    hair: ["#2b2b33", "#5a3b22", "#120f13", "#6b6b78"],
    shirt: ["#5b8def", "#e0574f", "#f5b942", "#31c8c8", "#9b6bd6"],
    pant: "#2f3a4c",
    green: "#2fd07a", amber: "#f5b942", red: "#ff5c5c", grey: "#8a94a6", cyan: "#31c8c8",
    night: "#0a1220", star: "#dfe9ff", moon: "#f2f0d8",
    leaf: "#3f9c58", pot: "#8a5a3b",
    paper: "#f2f2ec", paperInk: "#9aa4ae"
  };

  /* ------------------------------------------------------------------ tiny helpers */
  function px(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
  function text(ctx, str, x, y, col, scale) {
    scale = scale || 1;
    str = String(str).toUpperCase().replace(/&/g, "+").replace(/[^A-Z0-9\-.:!?/%+*() ]/g, "");
    ctx.fillStyle = col;
    for (var i = 0; i < str.length; i++) {
      var glyph = FONT[str[i]] || FONT["?"];
      var rows = glyph.split("/");
      for (var r = 0; r < rows.length; r++) {
        for (var c = 0; c < 3; c++) {
          if (rows[r][c] === "1") ctx.fillRect(x + (i * 4 + c) * scale, y + r * scale, scale, scale);
        }
      }
    }
  }
  function textCenter(ctx, str, cx, y, col, scale) {
    var w = String(str).length * 4 * (scale || 1);
    text(ctx, str, cx - w / 2, y, col, scale);
  }
  function textWidth(str, scale) { return String(str).length * 4 * (scale || 1); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function sleepZ(ctx, x, y, frame, col) {
    for (var i = 0; i < 3; i++) {
      var t = ((frame * 0.5 + i * 0.34) % 1.15);
      var a = (1 - t / 1.15) * 0.95;
      if (a <= 0.05) continue;
      ctx.globalAlpha = a;
      var zx = x + i * 5 + t * 3, zy = y - t * 12;
      var s = i === 0 ? 3 : (i === 1 ? 4 : 5);
      ctx.fillStyle = col;
      ctx.fillRect(zx | 0, zy | 0, s, 1);
      ctx.fillRect((zx + s - 1) | 0, zy | 0, 1, s);
      ctx.fillRect(zx | 0, (zy + s - 1) | 0, s, 1);
    }
    ctx.globalAlpha = 1;
  }
  function bubble(ctx, x, y, ch, col, frame) {
    var bob = Math.sin(frame * 0.7) * 1.2;
    px(ctx, x - 1, (y + bob) | 0, 8, 8, "#0d131c");
    px(ctx, x, (y + bob) | 0, 6, 6, col);
    text(ctx, ch, x + 2, (y + bob + 1) | 0, "#0d131c", 1);
  }
  function padlock(ctx, x, y) {
    px(ctx, x + 1, y, 4, 1, C.metal);
    px(ctx, x, y + 1, 1, 3, C.metal);
    px(ctx, x + 5, y + 1, 1, 3, C.metal);
    px(ctx, x, y + 4, 7, 6, "#c9a227");
    px(ctx, x + 3, y + 6, 1, 3, "#6d5209");
  }
  function person(ctx, x, y, pose, frame, o) {
    // x,y = top-left of the 8x12 sprite box. pose: sit | type1 | type2 | sleep | stand | walk1 | walk2
    var skin = C.skin[o % C.skin.length], hair = C.hair[(o + 1) % C.hair.length], shirt = C.shirt[o % C.shirt.length];
    if (pose === "sleep") {
      // slumped in the chair: head resting on folded arms, fully visible below the desk
      px(ctx, x + 1, y + 8, 8, 4, shirt);          // body
      px(ctx, x + 3, y + 11, 4, 2, C.pant);        // legs
      px(ctx, x + 3, y + 4, 4, 4, skin);           // head on the desk edge
      px(ctx, x + 3, y + 3, 4, 1, hair);
      px(ctx, x + 1, y + 9, 1, 2, skin); px(ctx, x + 8, y + 9, 1, 2, skin);  // arms
      return;
    }
    if (pose === "stand" || pose === "walk1" || pose === "walk2") {
      px(ctx, x + 2, y + 2, 4, 3, skin);
      px(ctx, x + 2, y + 1, 4, 1, hair);
      px(ctx, x + 2, y + 5, 4, 5, shirt);
      px(ctx, x + 1, y + 5, 1, 4, shirt); px(ctx, x + 6, y + 5, 1, 4, shirt);
      var legA = pose === "walk1" ? 2 : (pose === "walk2" ? 3 : 3);
      px(ctx, x + 2, y + 10, 1, legA, C.pant);
      px(ctx, x + 5, y + 10, 1, 4, C.pant);
      return;
    }
    // seated
    px(ctx, x + 2, y + 1, 4, 3, skin);
    px(ctx, x + 1, y, 6, 2, hair);
    px(ctx, x + 2, y + 4, 4, 5, shirt);
    var armY = frame % 2 === 0 ? 4 : 5;
    px(ctx, x + 1, y + armY, 1, 3, skin);          // arms reach the keyboard
    px(ctx, x + 6, y + armY, 1, 3, skin);
    px(ctx, x + 2, y + 9, 4, 2, C.pant);
  }

  /* ------------------------------------------------------------------ layout */
  function layout() {
    var harvest = { x: 1, y: 1, w: 238, h: 100 };
    var lobby = { x: 1, y: 103, w: 148, h: 55 };
    var corridor = { x: 151, y: 103, w: 88, h: 55 };
    var stations = [];
    var deskW = 42, gap = 3, x0 = 9, y = 0;
    for (var i = 0; i < 5; i++) {
      stations.push({ x: x0 + i * (deskW + gap), w: deskW, y: harvest.y + 2, h: 92 });
    }
    return { harvest: harvest, lobby: lobby, corridor: corridor, stations: stations };
  }

  function room(ctx, r, floorA, floorB) {
    px(ctx, r.x, r.y, r.w, r.h, C.wall);
    // checker floor
    for (var yy = r.y + 3; yy < r.y + r.h - 3; yy += 6) {
      for (var xx = r.x + 3; xx < r.x + r.w - 3; xx += 6) {
        var odd = (((xx - r.x) / 6) | 0) % 2 === (((yy - r.y) / 6) | 0) % 2;
        px(ctx, xx, yy, 6, 6, odd ? floorA : floorB);
      }
    }
    px(ctx, r.x, r.y + r.h - 3, r.w, 3, C.wallEdge);
  }

  function windows(ctx, lit) {
    for (var i = 0; i < 2; i++) {
      var wx = (i === 0 ? 14 : 206), wy = 2;
      px(ctx, wx - 1, wy, 20, 8, "#3b4a5e");
      px(ctx, wx, wy + 1, 18, 6, C.night);
      px(ctx, wx + 3, wy + 2, 1, 1, C.star); px(ctx, wx + 12, wy + 4, 1, 1, C.star);
      px(ctx, wx + 15, wy + 2, 3, 3, C.moon);
      if (lit) { px(ctx, wx, wy + 1, 18, 1, "rgba(255,220,150,0.35)"); }
    }
  }

  function plant(ctx, x, y) {
    px(ctx, x + 2, y + 6, 4, 4, C.pot);
    px(ctx, x + 1, y + 3, 6, 3, C.leaf);
    px(ctx, x + 3, y, 2, 3, C.leaf);
    px(ctx, x, y + 4, 3, 2, C.leaf);
    px(ctx, x + 5, y + 4, 3, 2, C.leaf);
  }

  function whiteboard(ctx, x, y) {
    px(ctx, x, y, 30, 16, "#d9d9d2");
    px(ctx, x, y, 30, 1, "#b9b9b0");
    text(ctx, "PLAN", x + 3, y + 4, "#2b3a4d", 1);
    px(ctx, x + 2, y + 10, 16, 1, "#8a94a6");
    px(ctx, x + 2, y + 12, 10, 1, "#8a94a6");
  }

  function coffee(ctx, x, y, frame, live) {
    px(ctx, x, y, 9, 11, C.metal);
    px(ctx, x + 1, y + 1, 7, 4, "#25303d");
    px(ctx, x + 3, y + 6, 3, 3, "#f2f2ec");
    if (live && frame % 3 === 0) { px(ctx, x + 3, y - 2, 1, 2, "rgba(255,255,255,0.5)"); }
    if (live && frame % 3 === 1) { px(ctx, x + 5, y - 3, 1, 2, "rgba(255,255,255,0.4)"); }
  }

  function exitSign(ctx, open) {
    px(ctx, 205, 4, 28, 9, open ? "#123a24" : "#3a1212");
    textCenter(ctx, open ? "OPEN" : "CLOSED", 219, 6, open ? C.green : C.red, 1);
  }

  /* ------------------------------------------------------------------ desks */
  function drawStation(ctx, st, slot, frame, power, t) {
    var x = st.x;
    var visual = slot.visual || { state: "vacant", tone: "grey", label: "Vacant", efficiency: 0 };
    var state = visual.state;
    var closed = power.state === "CLOSED";
    if (closed) state = "sleeping_off";
    var name = (slot.role || slot.id || "").split(" ")[0] || slot.id;
    var lane = shortLane(slot);
    var lit = !closed && (state === "working" || state === "review" || state === "blocked" || state === "celebrate");
    var lampOff = closed || state === "sleeping_off" || state === "sleeping_dead" || state === "vacant";

    // nameplate (lane) ---------------------------------------------------
    px(ctx, x + 6, 15, 30, 8, "#1b2532");
    if (visual.star && !closed) text(ctx, "*", x + 7, 16, C.amber, 1);
    textCenter(ctx, lane, x + 21 + (visual.star && !closed ? 2 : 0), 17, lit ? "#eaf1f8" : "#8a94a6", 1);

    // progress bar (only while working) ---------------------------------
    if (state === "working" && !closed) {
      var pct = Math.max(0, Math.min(100, slot.progress_percent || 0));
      px(ctx, x + 8, 25, 26, 3, "#0d131c");
      px(ctx, x + 9, 26, Math.max(1, Math.round(26 * pct / 100) - 1), 1, C.green);
    }

    // monitor -------------------------------------------------------------
    px(ctx, x + 12, 29, 18, 13, "#2a3646");
    px(ctx, x + 13, 30, 16, 10, lit ? C.screenOn : (closed ? C.screenOff : C.screenDim));
    if (lit) {
      for (var r = 0; r < 4; r++) {
        var w = 3 + ((r * 5 + frame) % 11);
        px(ctx, x + 14, 31 + r * 2 + 1, Math.min(w, 14), 1, "rgba(6,20,14,0.55)");
      }
    }
    px(ctx, x + 20, 42, 2, 3, "#2a3646");
    px(ctx, x + 16, 45, 10, 2, "#22303f");

    // desk ----------------------------------------------------------------
    px(ctx, x + 4, 48, 34, 8, C.desk);
    px(ctx, x + 4, 48, 34, 2, C.deskTop);
    px(ctx, x + 4, 54, 34, 2, C.deskEdge);
    px(ctx, x + 14, 50, 14, 3, "#d9d9d2");
    px(ctx, x + 38, 49, 2, 6, "#2a3646");
    if (!lampOff) px(ctx, x + 37, 47, 4, 2, "rgba(255,225,170,0.85)");
    var eff = visual.efficiency || 0;
    for (var i = 0; i < 3; i++) {
      var col = (visual.tone === "red" ? C.red : visual.tone === "amber" ? C.amber : C.green);
      px(ctx, x + 35 + i * 2, 52 - (i * 2), 1, 1 + i * 2, i < eff ? col : "#2a3646");
    }

    // occupant ------------------------------------------------------------
    var cx = x + 12;
    if (closed || state === "sleeping_off" || state === "sleeping_dead") {
      px(ctx, x + 9, 57, 14, 9, C.chair);
      person(ctx, x + 6, 54, "sleep", frame, stationIndex(slot));
      var zCol = state === "sleeping_dead" ? C.red : (closed ? "#5a6678" : C.grey);
      sleepZ(ctx, x + 25, 57, frame, zCol);
    } else if (state === "blocked") {
      px(ctx, x + 9, 57, 14, 9, C.chair);
      person(ctx, x + 1, 41, frame % 2 ? "walk1" : "walk2", frame, stationIndex(slot));
      bubble(ctx, x + 27, 38, "!", C.red, frame);
    } else if (state === "review") {
      px(ctx, x + 9, 57, 14, 9, C.chair);
      person(ctx, cx + 1, 42, "stand", frame, stationIndex(slot));
      px(ctx, x + 20, 52, 5, 7, C.paper);
      px(ctx, x + 21, 54, 3, 1, C.paperInk); px(ctx, x + 21, 56, 3, 1, C.paperInk);
      bubble(ctx, x + 28, 38, "?", C.amber, frame);
    } else if (state === "celebrate") {
      px(ctx, x + 9, 57, 14, 9, C.chair);
      person(ctx, cx + 1, 42, "stand", frame, stationIndex(slot));
      for (var sp = 0; sp < 4; sp++) {
        var sx = x + 6 + ((sp * 9 + frame * 3) % 30), sy = 44 - ((frame + sp * 3) % 9);
        px(ctx, sx, sy, 2, 2, sp % 2 ? C.amber : C.cyan);
      }
    } else if (state === "at_risk") {
      px(ctx, x + 9, 57, 14, 9, C.chair);
      person(ctx, cx + 1, 44, frame % 2 ? "sit" : "type1", frame, stationIndex(slot));
      bubble(ctx, x + 28, 38, "!", C.amber, frame);
    } else if (state === "vacant") {
      textCenter(ctx, "VACANT", x + 21, 65, "#4a5568", 1);
    } else {  // working
      px(ctx, x + 9, 57, 14, 9, C.chair);
      person(ctx, cx + 1, 44, frame % 2 === 0 ? "type1" : "type2", frame, stationIndex(slot));
      if (frame % 3 === 0) px(ctx, x + 30, 36, 1, 1, "rgba(255,255,255,0.5)");
    }

    // walk-in animation for a freshly replaced occupant
    var since = slot.occupant && slot.occupant.since ? Date.parse(slot.occupant.since) : 0;
    var ageS = (Date.now() - since) / 1000;
    if (!closed && since && ageS < 4 && ageS > 0) {

    });

    // --- closed-office night pass
    if (closed) {
      ctx.fillStyle = "rgba(6,10,18,0.55)";      // dark, but the sleeping agents stay readable
      ctx.fillRect(0, 0, W, H);

    } else if (power.state === "QUIET") {
      ctx.fillStyle = "rgba(6,10,18,0.22)";
      ctx.fillRect(0, 0, W, H);
    }

    // --- warm room light
    if (!closed) {
      ctx.fillStyle = power.state === "LIVE" ? "rgba(255,214,150,0.07)" : "rgba(255,214,150,0.04)";
      ctx.fillRect(0, 0, W, H);
    }

  /* ------------------------------------------------------------------ mount */
  function mount(container, data, handlers) {
    handlers = handlers || {};
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    canvas.className = "pixel-canvas";
    canvas.setAttribute("aria-label", "Pixel office view");
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    var wrap = document.createElement("div");
    wrap.className = "pixel-wrap" + (data.power && data.power.state === "CLOSED" ? " is-closed" : "");
    wrap.appendChild(canvas);

    var badge = document.createElement("div");
    badge.className = "pixel-power pixel-power-" + (data.power ? data.power.state : "CLOSED");
    badge.innerHTML = powerBadge(data.power);
    wrap.appendChild(badge);
    container.appendChild(wrap);

    var hits = { stations: [], rooms: [] };
    var frame = 0, stopped = false;

    function tick() {
      if (stopped) return;
      frame++;
      draw(ctx, data, frame, hits);
    }
    var timer = setInterval(tick, STEP);
    tick();

    function logical(ev) {
      var r = canvas.getBoundingClientRect();
      var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
      return { x: (cx * W) / r.width, y: (cy * H) / r.height };
    }
    function onClick(ev) {
      var p = logical(ev);
      var hit = null;
      hits.stations.forEach(function (s) {
        if (!hit && p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) hit = { kind: "station", id: s.id };
      });
      if (!hit) {
        // rooms are tested last-on-top: iterate in reverse
        for (var i = hits.rooms.length - 1; i >= 0; i--) {
          var r = hits.rooms[i];
          if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { hit = { kind: "room", id: r.id }; break; }
        }
      }
      if (!hit) return;
      if (hit.kind === "station" && handlers.onDesk) handlers.onDesk(hit.id);
      else if (hit.kind === "room") {
        if (hit.id === "manager" && handlers.onManager) handlers.onManager();
        else if (hit.id === "power" && handlers.onPower) handlers.onPower();
        else if (handlers.onDepartment) handlers.onDepartment(hit.id);
      }
    }
    canvas.addEventListener("click", onClick);
    canvas.addEventListener("touchstart", function (ev) { ev.preventDefault(); onClick(ev); }, { passive: false });

    return { destroy: function () { stopped = true; clearInterval(timer); } };
  }

  function powerBadge(power) {
    if (!power) return "";
    var s = power.state;
    if (s === "LIVE") return "<b>LIGHTS ON</b> · working now";
    if (s === "QUIET") return "<b>LIGHTS DIM</b> · last activity " + power.newest_activity_label;
    return "<b>LIGHTS OFF</b> · office closed · last activity " + power.newest_activity_label;
  }

  window.CentumPixel = { mount: mount, WIDTH: W, HEIGHT: H };
})();

  }

  /* ------------------------------------------------------------------ reports */
  function screenReports() {
    var s = el("div", "screen");
    if (!DATA.reports.length) { s.appendChild(el("div", "empty", "No reports yet.")); return s; }
    s.appendChild(el("div", "banner info", "<div class='t'>One report per manager run</div>" +
      "<div class='muted'>The newest is the truth. Health, what moved, and what needs you.</div>"));
    DATA.reports.forEach(function (r) {
      var hk = r.health.toUpperCase().indexOf("GOOD") === 0 ? "GOOD" : (r.health.toUpperCase().indexOf("CRITICAL") === 0 ? "CRITICAL" : "ATTENTION");
      var c = el("div", "card tap");
      c.innerHTML = "<div class='row'><div class='grow'><b>Daily report — " + esc(r.date) + "</b>" +
        "<div class='tiny'>" + ((r.actions || []).length) + " owner actions</div></div>" +
        "<span class='health-chip health-" + hk + "'>" + esc(r.health || "—") + "</span></div>";
      c.onclick = function () { location.hash = "#/report/" + r.date; };
      s.appendChild(c);
    });
    return s;
  }

  function screenReport(date) {
    var r = null;
    DATA.reports.forEach(function (x) { if (x.date === date) r = x; });
    if (!r) return el("div", "empty", "Report not found.");
    var s = el("div", "screen");
    if (r.actions && r.actions.length) {
      s.appendChild(el("div", "section-title", "Your actions <span class='count'>" + r.actions.length + "</span>"));
      r.actions.forEach(function (a, i) {
        var card = el("div", "action");
        var head = el("div", "action-head");
        head.innerHTML = "<div class='action-num'>" + esc(a.number || (i + 1)) + "</div><div class='grow'><h3>" + esc(a.title) + "</h3></div>";
        card.appendChild(head);
        card.appendChild(md(a.html));
        if (a.prompts && a.prompts.length) {
          a.prompts.forEach(function (p, pi) {
            var b = el("button", "btn primary", a.prompts.length > 1 ? "Copy prompt " + (pi + 1) : "Copy this prompt");
            b.onclick = function () { copy(p, "Prompt copied — paste into a fresh Arena chat"); };
            card.appendChild(b);
          });
        }
        var gb = el("button", "btn ghost sm", "Open in GitHub");
        gb.style.marginTop = "8px";
        gb.onclick = function () { window.open(REPO + "/blob/main/" + r.path, "_blank"); };
        card.appendChild(gb);
        s.appendChild(card);
      });
    }
    s.appendChild(el("div", "section-title", "Full report"));
    var full = md(r.html);
    s.appendChild(full);
    // copy buttons next to every code prompt inside the full report
    Array.prototype.forEach.call(full.querySelectorAll("pre"), function (pre) {
      var b = el("button", "btn sm", "Copy prompt");
      b.style.marginTop = "-6px";
      b.onclick = function () { copy(pre.innerText, "Prompt copied"); };
      pre.parentNode.insertBefore(b, pre.nextSibling);
    });
    return s;
  }

  /* ------------------------------------------------------------------ help */
  function managerPrompt() {
    return "You are the Manager Agent for the CENTUM AI Office. Repository: " + REPO + ".\n\n" +
      "Run your full workflow now:\n" +
      "PHASE 0 — Read board.json, the newest file in reports/daily/, every agents/agent-XX/log.md, and OFFICE.md Section 2 (is the freeze still on?). Say \"Manager online. Reading office state...\" then describe what you found in 3 lines.\n" +
      "PHASE 1 — Audit all five slots (ACTIVE / BLOCKED / REVIEW / STAGED). For REVIEW, verify on Drive with a list call (never from the agent's summary) and pass or fail each item of the matching checklist in training/quality-checklist.md, showing PASS/FAIL per item with evidence. On any fail, write surgical feedback into that agent's current.md and set the slot back to ACTIVE.\n" +
      "PHASE 2 — Assign the next highest-priority unblocked task from tasks/queue/ to every EMPTY or newly-DONE slot; move the file to tasks/active/ and write the full assignment into current.md including the stop condition and the owner's paste prompt.\n" +
      "PHASE 3 — If tasks/queue/ has fewer than 10 tasks, author the next batch (check tasks/done/ first so nothing is repeated).\n" +
      "PHASE 4 — Write or update reports/daily/<today>.md using the template in reports/daily/README.md, then refresh reports/READY_MANIFEST.md for anything newly verified.\n" +
      "PHASE 5 — Post the summary block: office health, quick status counts, and the numbered owner actions, each copy-paste ready.\n\n" +
      "Hard rules: never produce student content yourself; never paste the Apps Script secret anywhere; never delete Drive content; nothing reaches a student-facing folder without the page-1 subject gate; keep the freeze unless the owner says GO; keep the queue at 10 or more tasks.";
  }

  function screenHelp() {
    var s = el("div", "screen");
    s.appendChild(el("div", "banner gold", "<div class='t'>Your 30-second routine</div>" +
      "<div class='muted'>Read the health chip at the top. If it is yellow or red, the office needs you — the rest is the agents' job.</div>"));
    var steps = el("ol", "steps");
    [
      "Open this app. Health chip + the red freeze strip tell you the state.",
      "Tap the badge on <b>Help</b> (or the gold card on Office) — that is exactly what needs you.",
      "Tap <b>Copy prompt</b> on each action and paste it into a fresh Arena chat. One chat per agent slot.",
      "Say <b>GO</b> in the manager chat when a decision is asked for. Nothing publishes without it.",
      "Come back here: the agent you started will appear as Working, then move to Review, then Done."
    ].forEach(function (t) { steps.appendChild(el("li", "", t)); });
    s.appendChild(steps);

    var mp = managerPrompt();
    s.appendChild(el("div", "section-title", "Run the manager"));
    var mc = el("div", "card");
    mc.innerHTML = "<div class='muted'>Paste this into the manager chat (this session or a new one) whenever you want a manager run.</div>";
    var mb = el("button", "btn primary", "Copy manager prompt");
    mb.style.marginTop = "10px";
    mb.onclick = function () { copy(mp, "Manager prompt copied"); };
    mc.appendChild(mb);
    s.appendChild(mc);

    if (DATA.owner_actions && DATA.owner_actions.length) {
      s.appendChild(el("div", "section-title", "Waiting on you now <span class='count'>" + DATA.owner_actions.length + "</span>"));
      DATA.owner_actions.forEach(function (a, i) {
        var card = el("div", "action");
        var head = el("div", "action-head");
        head.innerHTML = "<div class='action-num'>" + esc(a.number || (i + 1)) + "</div><div class='grow'><h3>" + esc(a.title) + "</h3></div>";
        card.appendChild(head);
        card.appendChild(md(a.html));
        (a.prompts || []).forEach(function (p, pi) {
          var b = el("button", "btn primary", a.prompts.length > 1 ? "Copy prompt " + (pi + 1) : "Copy this prompt");
          b.onclick = function () { copy(p, "Prompt copied — paste into a fresh Arena chat"); };
          card.appendChild(b);
        });
        s.appendChild(card);
      });
    }

    s.appendChild(el("div", "section-title", "Put it on your phone home screen"));
    var inst = el("div", "card");
    inst.innerHTML =
      "<div class='kv'><b>iPhone</b><span>Safari → Share → <b>Add to Home Screen</b></span></div>" +
      "<div class='kv'><b>Android</b><span>Chrome → ⋮ → <b>Add to Home screen</b></span></div>" +
      "<div class='kv'><b>GitHub Pages</b><span>the permanent link (Settings → Pages → branch main → /app)</span></div>" +
      "<div class='kv'><b>Refresh</b><span>pull down or tap ⟳ in the header — the app re-reads office.json</span></div>";
    s.appendChild(inst);

    s.appendChild(el("div", "section-title", "Links"));
    var links = el("div", "card");
    [["Repository", REPO], ["Read OFFICE.md", REPO + "/blob/main/OFFICE.md"],
     ["Daily reports", REPO + "/tree/main/reports/daily"], ["Task queue", REPO + "/tree/main/tasks/queue"],
     ["Single-file version (works anywhere)", REPO + "/blob/main/app/index.standalone.html"]].forEach(function (l) {
      var row = el("div", "kv");
      row.innerHTML = "<b>" + esc(l[0]) + "</b><span><a href='" + esc(l[1]) + "' target='_blank' rel='noopener'>open ↗</a></span>";
      links.appendChild(row);
    });
    s.appendChild(links);
    return s;
  }

  /* ------------------------------------------------------------------ router */
  var ROUTES = {
    office: screenOffice, agents: screenAgents, tasks: screenTasks, reports: screenReports,
    help: screenHelp, files: screenFiles, work: screenWork, plan: screenPlan
  };

  function render() {
    var view = document.getElementById("view");
    var parts = (location.hash || "#/office").replace(/^#\/?/, "").split("/");
    var route = parts[0] || "office";
    var arg = parts.slice(1).join("/");
    var node;
    if (route === "agent") { node = screenAgent(arg); state.tab = "agents"; }
    else if (route === "task") { node = screenTask(arg); state.tab = "tasks"; }
    else if (route === "report") { node = screenReport(arg); state.tab = "reports"; }
    else { node = (ROUTES[route] || screenOffice)(); state.tab = (route === "plan" || route === "work" || route === "files") ? "help" : (ROUTES[route] ? route : "office"); }
    view.innerHTML = "";
    view.appendChild(node);
    paintNav();
    window.scrollTo({ top: 0, behavior: "instant" in document.documentElement.style ? "instant" : "auto" });
  }

  /* ------------------------------------------------------------------ boot */
  function boot(data) {
    DATA = data;
    document.title = "CENTUM AI Office — " + data.office.health;
    paintHeader();
    render();
    if (!boot.wired) {
      boot.wired = true;
      window.addEventListener("hashchange", render);
      var rb = document.getElementById("refreshBtn");
      if (rb) rb.onclick = refresh;
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        navigator.serviceWorker.register("sw.js").catch(function () { /* offline extras are optional */ });
      }
    }
  }

  function refresh() {
    toast("Refreshing…");
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    }
    fetch("data/office.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("no json"); return r.json(); })
      .then(function (d) { boot(d); toast("Refreshed " + d.generated_label); })
      .catch(function () { location.reload(); });
  }
  window.centumRefresh = refresh;

  function failed(msg) {
    document.getElementById("view").innerHTML =
      "<div class='banner warn'><div class='t'>Could not load office data</div>" + esc(msg) + "</div>" +
      "<div class='card'><div class='tiny'>Fix</div><div style='margin-top:6px'>Run <code>python3 tools/build_office_data.py</code> and refresh.</div></div>";
  }

  loadData().then(boot, function (e) { failed(e.message || String(e)); });
})();

</script>
</body>
</html>
